<body><a href="/" aria-label="Back to menu" style="display:inline-block;margin:16px 18px 0;color:#fff;text-decoration:none;font-family:Arial,sans-serif;font-weight:700">← Back to menu</a><main><p class="logo">HARD<span>LE</span></p><section class="panel"><h1>Who is it?</h1><p class="muted">Guess the artist</p><p id="counter"></p><ol id="clues"></ol><form id="guess-form"><label for="guess">Artist name</label><div class="guessBox"><input id="guess" class="guessInput" autocomplete="off" required placeholder="Search for an artist" aria-controls="artist-results" aria-expanded="false"><button id="submit" class="guessSubmit" type="submit">Guess</button><div id="artist-results" class="results" aria-label="Matching artists" hidden></div></div></form><p id="message" role="status" aria-live="polite"></p><ol id="history" aria-label="Your guesses"></ol><p id="daily-countdown" class="muted" aria-live="off"></p></section></main>
<script>
const artists=[{"name": "Act of Rage", "clues": ["Age: 32", "Label: Roughstate", "Active since: 2014", "Country: 🇳🇱 Netherlands", "Genre: Rawstyle", "Gender: Male"]}, {"name": "Adaro", "clues": ["Age: 46", "Label: Roughstate", "Active since: 2002", "Country: 🇳🇱 Netherlands", "Genre: Hardstyle / Rawstyle", "Gender: Male"]}, {"name": "Adrenalize", "clues": ["Age: 29", "Label: Scantraxx", "Active since: 2011", "Country: 🇩🇰 Denmark", "Genre: Euphoric Hardstyle", "Gender: Male"]}, {"name": "Audiofreq", "clues": ["Age: 42", "Label: Audiophetamine", "Active since: 2011", "Country: 🇦🇺 Australia", "Genre: Hardstyle / Hardcore", "Gender: Male"]}, {"name": "B-Front", "clues": ["Age: 38", "Label: Roughstate", "Active since: 2005", "Country: 🇳🇱 Netherlands", "Genre: Hardstyle / Rawstyle", "Gender: Male"]}, {"name": "Brennan Heart", "clues": ["Age: 44", "Label: I AM HARDSTYLE", "Active since: 2001", "Country: 🇳🇱 Netherlands", "Genre: Hardstyle", "Gender: Male"]}, {"name": "Code Black", "clues": ["Age: 39", "Label: WE R Music", "Active since: 2011", "Country: 🇦🇺 Australia", "Genre: Hardstyle", "Gender: Male"]}, {"name": "D-Block & S-te-Fan", "clues": ["Age: 38 / 43", "Label: Scantraxx (main) / Scantraxx Evolutionz (own sublabel)", "Active since: 2005", "Country: 🇳🇱 Netherlands", "Genre: Hardstyle / Rawstyle", "Gender: Male (duo)"]}, {"name": "Da Tweekaz", "clues": ["Age: 39 / 39", "Label: Dirty Workz", "Active since: 2007", "Country: 🇳🇴 Norway", "Genre: Hardstyle", "Gender: Male (duo)"]}, {"name": "Demi Kanon", "clues": ["Age: 30", "Label: Scantraxx", "Active since: 2014", "Country: 🇳🇱 Netherlands", "Genre: Hardstyle", "Gender: Male"]}, {"name": "Digital Punk", "clues": ["Age: 41", "Label: Scantraxx (main) / Roughstate (2026 release)", "Active since: 2008", "Country: 🇳🇱 Netherlands", "Genre: Rawstyle", "Gender: Male"]}, {"name": "Dr. Peacock", "clues": ["Age: 37", "Label: Frenchcore Worldwide / Peacock Records (own label)", "Active since: 2010", "Country: 🇫🇷 France", "Genre: Frenchcore", "Gender: Male"]}, {"name": "Dual Damage", "clues": ["Age: 21 / 21", "Label: Gearbox Digital", "Active since: 2021", "Country: 🇳🇱 Netherlands", "Genre: Rawstyle", "Gender: Male (duo)"]}, {"name": "Fraw", "clues": ["Age: 27", "Label: Gearbox Digital", "Active since: 2018", "Country: 🇩🇪 Germany", "Genre: Rawstyle", "Gender: Male"]}, {"name": "Frontliner", "clues": ["Age: 42", "Label: Scantraxx (2026 release)", "Active since: 2005", "Country: 🇳🇱 Netherlands", "Genre: Hardstyle", "Gender: Male"]}, {"name": "Hard Driver", "clues": ["Age: 38", "Label: Dirty Workz", "Active since: 2008", "Country: 🇧🇪 Belgium", "Genre: Hardstyle / Rawstyle", "Gender: Male"]}, {"name": "Headhunterz", "clues": ["Age: 41", "Label: Art of Creation", "Active since: 2003", "Country: 🇳🇱 Netherlands", "Genre: Hardstyle", "Gender: Male"]}, {"name": "Hysta", "clues": ["Age: 28", "Label: Masters of Hardcore", "Active since: 2017", "Country: 🇫🇷 France", "Genre: Frenchcore", "Gender: Female"]}, {"name": "KELTEK", "clues": ["Age: 41", "Label: Scantraxx", "Active since: 2017", "Country: 🇳🇱 Netherlands", "Genre: Hardstyle", "Gender: Male"]}, {"name": "Krowdexx", "clues": ["Age: 27 / 27", "Label: Gearbox Digital", "Active since: 2018", "Country: 🇮🇹 Italy", "Genre: Rawstyle", "Gender: Male (duo)"]}, {"name": "Lil Texas", "clues": ["Age: 29", "Label: TX2", "Active since: 2018", "Country: 🇺🇸 USA", "Genre: Uptempo / Hardcore", "Gender: Male"]}, {"name": "Max Enforcer", "clues": ["Age: 46", "Label: Art of Creation", "Active since: 2003", "Country: 🇳🇱 Netherlands", "Genre: Hardstyle", "Gender: Male"]}, {"name": "Miss K8", "clues": ["Age: 45", "Label: Masters of Hardcore", "Active since: 2011", "Country: 🇺🇦 Ukraine", "Genre: Hardcore", "Gender: Female"]}, {"name": "N-Vitral", "clues": ["Age: 46", "Label: Minus Is More", "Active since: 1999", "Country: 🇳🇱 Netherlands", "Genre: Hardcore", "Gender: Male"]}, {"name": "Neophyte", "clues": ["Age: 55", "Label: Neophyte Records", "Active since: 1989", "Country: 🇳🇱 Netherlands", "Genre: Hardcore", "Gender: Male"]}, {"name": "Noisecontrollers", "clues": ["Age: 46", "Label: Art of Creation", "Active since: 2005", "Country: 🇳🇱 Netherlands", "Genre: Hardstyle", "Gender: Male"]}, {"name": "Ophidian", "clues": ["Age: 43", "Label: Thunderdome Music (signed) / Advancing Mechanism / Enzyme", "Active since: 1998", "Country: 🇳🇱 Netherlands", "Genre: Hardcore", "Gender: Male"]}, {"name": "Partyraiser", "clues": ["Age: 50", "Label: Partyraiser Records", "Active since: 2002", "Country: 🇳🇱 Netherlands", "Genre: Hardcore / Uptempo", "Gender: Male"]}, {"name": "Paul Elstak", "clues": ["Age: 60", "Label: Rotterdam Records", "Active since: 1987", "Country: 🇳🇱 Netherlands", "Genre: Hardcore", "Gender: Male"]}, {"name": "Phuture Noize", "clues": ["Age: 32", "Label: Art of Creation", "Active since: 2014", "Country: 🇳🇱 Netherlands", "Genre: Hardstyle", "Gender: Male"]}, {"name": "Radical Redemption", "clues": ["Age: 36", "Label: Redemption Records (own label since 2023)", "Active since: 2011", "Country: 🇳🇱 Netherlands", "Genre: Rawstyle", "Gender: Male"]}, {"name": "Ran-D", "clues": ["Age: 45", "Label: RAVE ERA / Defqon.1 Records (2026 releases)", "Active since: 2006", "Country: 🇳🇱 Netherlands", "Genre: Hardstyle / Rawstyle", "Gender: Male"]}, {"name": "Sefa", "clues": ["Age: 26", "Label: Sefa Music", "Active since: 2014", "Country: 🇳🇱 Netherlands", "Genre: Frenchcore", "Gender: Male"]}, {"name": "Showtek", "clues": ["Age: 44 / 42", "Label: F_CK THE SYSTEM (with Be Yourself Music, since July 2026)", "Active since: 2001", "Country: 🇳🇱 Netherlands", "Genre: Hardstyle / EDM", "Gender: Male (duo)"]}, {"name": "Sub Zero Project", "clues": ["Age: 30 / 29", "Label: Dirty Workz", "Active since: 2013", "Country: 🇳🇱 Netherlands", "Genre: Hardstyle / Rawstyle", "Gender: Male (duo)"]}, {"name": "Technoboy", "clues": ["Age: 55", "Label: Titanic Records", "Active since: 1992", "Country: 🇮🇹 Italy", "Genre: Hardstyle", "Gender: Male"]}, {"name": "Vertile", "clues": ["Age: 27", "Label: Art of Creation", "Active since: 2017", "Country: 🇳🇱 Netherlands", "Genre: Hardstyle / Rawstyle", "Gender: Male"]}, {"name": "Warface", "clues": ["Age: 33", "Label: End of Line", "Active since: 2010", "Country: 🇳🇱 Netherlands", "Genre: Rawstyle", "Gender: Male"]}, {"name": "Wildstylez", "clues": ["Age: 43", "Label: Art of Creation", "Active since: 2007", "Country: 🇳🇱 Netherlands", "Genre: Hardstyle", "Gender: Male"]}, {"name": "Zatox", "clues": ["Age: 50", "Label: Unite Records", "Active since: 2002", "Country: 🇮🇹 Italy", "Genre: Rawstyle / Hardstyle", "Gender: Male"]}];
const $=id=>document.getElementById(id);const normalize=s=>s.toLowerCase().replace(/[^a-z0-9]/g,'');let order=[],round=0,attempts=[],finished=false;
function stockholmDate(now=new Date()){const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Stockholm',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(now);const get=type=>parts.find(p=>p.type===type).value;return get('year')+'-'+get('month')+'-'+get('day')}
const puzzleDate=stockholmDate();const storageKey='hardle-artist-daily-v1-'+puzzleDate;
order=artists.map((_,i)=>i);let seed=0x41525449;for(let i=order.length-1;i>0;i--){seed=(Math.imul(seed,1664525)+1013904223)>>>0;const j=seed%(i+1);[order[i],order[j]]=[order[j],order[i]]}
const day=Math.floor(Date.parse(puzzleDate+'T00:00:00Z')/86400000);round=((day-20732)%order.length+order.length)%order.length;
function saveProgress(){try{localStorage.setItem(storageKey,JSON.stringify({attempts}))}catch{ $('message').textContent+=' Progress could not be saved in this browser.' }}
function restoreProgress(){try{const saved=JSON.parse(localStorage.getItem(storageKey)||'null');if(saved&&Array.isArray(saved.attempts)){attempts=[...new Set(saved.attempts.filter(name=>artists.some(a=>a.name===name)))].slice(0,6);const correct=attempts.includes(artists[order[round]].name);finished=correct||attempts.length===6;$('message').textContent=correct?'Correct! Come back tomorrow for a new artist.':finished?'Out of attempts. The artist was '+artists[order[round]].name+'. Come back tomorrow.':''}}catch{}render()}
function updateCountdown(){const now=new Date();if(stockholmDate(now)!==puzzleDate){location.reload();return}let low=now.getTime(),high=low+27*3600000;while(high-low>1){const mid=Math.floor((low+high)/2);if(stockholmDate(new Date(mid))===puzzleDate)low=mid;else high=mid}const ms=high-now.getTime();$('daily-countdown').textContent='Next artist in '+[Math.floor(ms/3600000),Math.floor(ms%3600000/60000),Math.floor(ms%60000/1000)].map(n=>String(n).padStart(2,'0')).join(':');}
function render(){const artist=artists[order[round]];$('counter').textContent=`Attempts: ${attempts.length} / 6`;$('clues').replaceChildren();artist.clues.slice(0,Math.min(attempts.length+1,6)).forEach(clue=>{const li=document.createElement('li');li.textContent=clue;$('clues').append(li)});$('history').replaceChildren();attempts.forEach(name=>{const li=document.createElement('li');li.textContent=name+(normalize(name)===normalize(artist.name)?' — Correct!':' — Incorrect');$('history').append(li)});$('guess').disabled=finished;$('submit').disabled=finished;}

function hideResults(){$('artist-results').hidden=true;$('guess').setAttribute('aria-expanded','false')}
function searchArtists(){const box=$('artist-results');box.replaceChildren();const q=normalize($('guess').value);if(!q||finished){hideResults();return}const found=artists.filter(a=>normalize(a.name).includes(q)).slice(0,12);found.forEach(artist=>{const button=document.createElement('button');button.type='button';button.className='result';button.textContent=artist.name;button.addEventListener('click',()=>{$('guess').value=artist.name;hideResults();$('guess').focus()});box.append(button)});box.hidden=found.length===0;$('guess').setAttribute('aria-expanded',String(found.length>0))}
$('guess').addEventListener('input',searchArtists);
$('guess').addEventListener('keydown',event=>{if(event.key==='Escape')hideResults();if(event.key==='ArrowDown'&&!$('artist-results').hidden){event.preventDefault();$('artist-results').firstElementChild?.focus()}});
$('artist-results').addEventListener('keydown',event=>{if(event.key==='Escape'){hideResults();$('guess').focus()}if(event.key==='ArrowDown'||event.key==='ArrowUp'){event.preventDefault();const sibling=event.key==='ArrowDown'?event.target.nextElementSibling:event.target.previousElementSibling;if(sibling)sibling.focus();else $('guess').focus()}});
document.addEventListener('click',event=>{if(!event.target.closest('.guessBox'))hideResults()});
$('guess-form').addEventListener('submit',event=>{event.preventDefault();hideResults();if(stockholmDate()!==puzzleDate){location.reload();return}if(finished)return;const value=$('guess').value.trim();const selected=artists.find(a=>normalize(a.name)===normalize(value));if(!selected){$('message').textContent='Choose an artist from the suggestions.';return}if(attempts.some(a=>normalize(a)===normalize(value))){$('message').textContent='You already guessed that artist.';return}attempts.push(selected.name);const correct=selected.name===artists[order[round]].name;finished=correct||attempts.length===6;$('message').textContent=correct?'Correct! You found the artist.':finished?`Out of attempts. The artist was ${artists[order[round]].name}.`:'Not quite — a new clue is available.';$('guess').value='';saveProgress();render();if(!finished)$('guess').focus()});
restoreProgress();updateCountdown();setInterval(updateCountdown,1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)updateCountdown()});window.addEventListener('focus',updateCountdown);
window.addEventListener('storage',event=>{if(event.key===storageKey)restoreProgress()});
</script></body></html>
