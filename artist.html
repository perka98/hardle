const day=Math.floor(Date.parse(puzzleDate+'T00:00:00Z')/86400000);round=((day-20732+(puzzleDate==='2026-10-06'?17:0))%order.length+order.length)%order.length;

function showCorrectCard(artist){const card=$('correct-card');const src=artistImages[artist.name];if(!src){card.hidden=true;return}$('correct-image').src=src;$('correct-image').alt=artist.name;$('correct-name').textContent=artist.name;card.hidden=false}function hideCorrectCard(){$('correct-card').hidden=true}function restoreProgress(){try{const saved=JSON.parse(localStorage.getItem(storageKey)||'null');if(saved&&Array.isArray(saved.attempts)){attempts=[...new Set(saved.attempts.filter(name=>artists.some(a=>a.name===name)))].slice(0,6);const correct=attempts.includes(artists[order[round]].name);finished=correct||attempts.length===6;$('message').textContent=correct?'Correct! Come back tomorrow for a new artist.':finished?'Out of attempts. The artist was '+artists[order[round]].name+'. Come back tomorrow.':'';}}catch{}render()}
function updateCountdown(){const now=new Date();if(stockholmDate(now)!==puzzleDate){location.reload();return}let low=now.getTime(),high=low+27*3600000;while(high-low>1){const mid=Math.floor((low+high)/2);if(stockholmDate(new Date(mid))===puzzleDate)low=mid;else high=mid}const ms=high-now.getTime();$('daily-countdown').textContent='Next artist in '+[Math.floor(ms/3600000),Math.floor(ms%3600000/60000),Math.floor(ms%60000/1000)].map(n=>String(n).padStart(2,'0')).join(':');}
function render(){const artist=artists[order[round]];$('counter').textContent=`Attempts: ${attempts.length} / 6`;$('clues').replaceChildren();artist.clues.slice(0,Math.min(attempts.length+1,6)).forEach(clue=>{const li=document.createElement('li');li.textContent=clue;$('clues').append(li)});$('history').replaceChildren();attempts.forEach(name=>{const li=document.createElement('li');li.textContent=name+(normalize(name)===normalize(artist.name)?' — Correct!':' — Incorrect');$('history').append(li)});$('guess').disabled=finished;$('submit').disabled=finished;}

function hideResults(){$('artist-results').hidden=true;$('guess').setAttribute('aria-expanded','false')}
function searchArtists(){const box=$('artist-results');box.replaceChildren();const q=normalize($('guess').value);if(!q||finished){hideResults();return}const found=artists.filter(a=>normalize(a.name).includes(q)&&!attempts.some(name=>normalize(name)===normalize(a.name))).slice(0,12);found.forEach(artist=>{const button=document.createElement('button');button.type='button';button.className='result';button.textContent=artist.name;button.addEventListener('click',()=>{$('guess').value=artist.name;hideResults();$('guess').focus()});box.append(button)});box.hidden=found.length===0;$('guess').setAttribute('aria-expanded',String(found.length>0))}
$('guess').addEventListener('input',searchArtists);
$('guess').addEventListener('keydown',event=>{if(event.key==='Escape')hideResults();if(event.key==='ArrowDown'&&!$('artist-results').hidden){event.preventDefault();$('artist-results').firstElementChild?.focus()}});
$('artist-results').addEventListener('keydown',event=>{if(event.key==='Escape'){hideResults();$('guess').focus()}if(event.key==='ArrowDown'||event.key==='ArrowUp'){event.preventDefault();const sibling=event.key==='ArrowDown'?event.target.nextElementSibling:event.target.previousElementSibling;if(sibling)sibling.focus();else $('guess').focus()}});
document.addEventListener('click',event=>{if(!event.target.closest('.guessBox'))hideResults()});
$('guess-form').addEventListener('submit',event=>{event.preventDefault();hideResults();if(stockholmDate()!==puzzleDate){location.reload();return}if(finished)return;const value=$('guess').value.trim();const selected=artists.find(a=>normalize(a.name)===normalize(value));if(!selected){$('message').textContent='Choose an artist from the suggestions.';return}if(attempts.some(a=>normalize(a)===normalize(value))){$('message').textContent='You already guessed that artist.';return}attempts.push(selected.name);const correct=selected.name===artists[order[round]].name;finished=correct||attempts.length===6;if(finished)showResult();$('message').textContent=correct?'Correct! You found the artist.':finished?`Out of attempts. The artist was ${artists[order[round]].name}.`:'Not quite — a new clue is available.';$('guess').value='';saveProgress();render();if(!finished)$('guess').focus()});
const artistStatsKey='hardle-artist-stats-v1';let artistStats={played:0,wins:0,streak:0,best:0,lastWin:null,distribution:[0,0,0,0,0,0]};try{const saved=JSON.parse(localStorage.getItem(artistStatsKey)||'null');if(saved)artistStats={...artistStats,...saved}}catch{}
function recordArtistResult(){if(!finished)return;try{if(localStorage.getItem(storageKey+'-recorded'))return;const won=attempts.includes(artists[order[round]].name);artistStats.played++;if(won){artistStats.wins++;const yesterday=new Date(Date.parse(puzzleDate+'T00:00:00Z')-86400000).toISOString().slice(0,10);artistStats.streak=artistStats.lastWin===puzzleDate?artistStats.streak:artistStats.lastWin===yesterday?artistStats.streak+1:1;artistStats.best=Math.max(artistStats.best,artistStats.streak);artistStats.lastWin=puzzleDate;artistStats.distribution[attempts.length-1]++}else artistStats.streak=0;localStorage.setItem(artistStatsKey,JSON.stringify(artistStats));localStorage.setItem(storageKey+'-recorded','1')}catch{}}
function renderArtistStats(){recordArtistResult();$('artist-stats').replaceChildren();for(const [label,value] of [['Played',artistStats.played],['Win %',artistStats.played?Math.round(artistStats.wins/artistStats.played*100):0],['Streak',artistStats.streak],['Best streak',artistStats.best],['Wins',artistStats.wins],['Today',attempts.length+'/6']]){const div=document.createElement('div'),b=document.createElement('b'),span=document.createElement('span');b.textContent=value;span.textContent=label;div.append(b,span);$('artist-stats').append(div)}$('artist-distribution').replaceChildren();const max=Math.max(1,...artistStats.distribution);artistStats.distribution.forEach((count,i)=>{const bar=document.createElement('div');bar.style.width=Math.max(12,count/max*100)+'%';bar.textContent=(i+1)+': '+count;$('artist-distribution').append(bar)})}
$('artist-copy').onclick=async()=>{try{await navigator.clipboard.writeText('HARDLE Guess the Artist '+puzzleDate+' '+attempts.length+'/6\n'+attempts.map(name=>name===artists[order[round]].name?'🟩':'⬛').join(''));$('artist-copy').textContent='Copied!'}catch{$('artist-copy').textContent='Copy failed'}};
function showResult(){renderArtistStats();const won=attempts.includes(artists[order[round]].name);$('result-title').textContent=won?'CORRECT!':'GAME OVER';document.querySelector('.correctIcon').textContent=won?'🎉':'🎧';document.querySelector('.correctSub').textContent=won?'You found today’s artist.':'Better luck tomorrow. Here is today’s artist.';if(won){try{localStorage.setItem('hardle-completed-artist-'+puzzleDate,'1')}catch{}}const artist=artists[order[round]];const link=$('artist-spotify');link.hidden=true;link.removeAttribute('href');link.textContent='Open artist on Spotify ↗';fetch('/api/spotify-artist?artist='+encodeURIComponent(artist.name)).then(r=>r.ok?r.json():null).then(data=>{if(data&&/^https:\/\/open\.spotify\.com\/artist\/[A-Za-z0-9]{22}$/.test(data.spotify_url)){link.href=data.spotify_url;link.hidden=false;link.textContent='Open artist on Spotify ↗'}}).catch(()=>{});$('result-artist').textContent=artist.name;const src=artistImages[artist.name];$('result-photo').hidden=!src;if(src){$('result-photo').src=src;$('result-photo').alt=artist.name;}$('result-guesses').textContent=attempts.length+' / 6';$('result-genre').textContent=artist.clues[4].replace('Genre: ','');$('result-country').textContent=artist.clues[3].replace('Country: ','');$('result-modal').classList.add('show');$('result-modal').setAttribute('aria-hidden','false');$('result-close').focus()}
function closeResult(){$('result-modal').classList.remove('show');$('result-modal').setAttribute('aria-hidden','true')}
$('result-close').addEventListener('click',closeResult);$('result-modal').addEventListener('click',e=>{if(e.target===$('result-modal'))closeResult()});document.addEventListener('keydown',e=>{if(!$('result-modal').classList.contains('show'))return;if(e.key==='Escape')closeResult();if(e.key==='Tab'){const last=$('result-close'),first=$('artist-spotify').hidden?last:$('artist-spotify');if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
restoreProgress();recordArtistResult();if(finished)showResult();updateCountdown();setInterval(updateCountdown,1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)updateCountdown()});window.addEventListener('focus',updateCountdown);
window.addEventListener('storage',event=>{if(event.key===storageKey)restoreProgress()});
</script></body></html>
