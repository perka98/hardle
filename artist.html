<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HARDLE — Guess the Artist</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#050508 url("https://q-dance-network-images.akamaized.net/41347/1764931474-20250629_defqon-1_25_years_of_hardstyle-42_mno.jpg?auto=compress&fit=max&w=1440") center center/cover fixed no-repeat;color:#fff;font-family:Arial,sans-serif;position:relative}body:before{content:"";position:fixed;inset:0;background:linear-gradient(rgba(5,5,8,.40),rgba(5,5,8,.72));z-index:-1;pointer-events:none}main{max-width:640px;margin:auto;padding:40px 20px}a{color:#fff}.logo{font-size:52px;font-weight:900;letter-spacing:-3px;text-align:center}.logo span{color:#e21b23}.panel{padding:24px;border-radius:24px;background:linear-gradient(145deg,#211119ee,#111117ee);border:1px solid #ffffff25;box-shadow:0 20px 60px #0005}h1{margin-top:0}p,li{line-height:1.5}.muted{color:#c4c4ca}input,button{font:inherit;border-radius:12px;padding:12px 16px}input{width:100%;background:#09090e;color:white;border:1px solid #777;margin:8px 0 12px}button{background:#e21b23;color:white;border:0;font-weight:900;cursor:pointer}button:disabled{opacity:.5;cursor:default}button:focus-visible,input:focus-visible{outline:3px solid white;outline-offset:3px}li{margin-bottom:10px}#message{min-height:24px}#history{padding-left:24px}[hidden]{display:none!important}
</style>
</head>
<body><main><a href="/">← Back to games</a><p class="logo">HARD<span>LE</span></p><section class="panel"><h1>Who is it?</h1><p class="muted">DEMO — fictional artist and example facts, not verified artist information. Guess Demo Artist in six attempts. Each wrong guess reveals another clue: age, label, active since, country, genre, then gender.</p><p id="counter"></p><ol id="clues"></ol><form id="guess-form"><label for="guess">Artist name</label><input id="guess" list="artists" autocomplete="off" required placeholder="Choose or type an artist"><datalist id="artists"></datalist><button id="submit" type="submit">Guess artist</button></form><p id="message" role="status" aria-live="polite"></p><ol id="history" aria-label="Your guesses"></ol><button id="next" type="button" hidden>Next artist →</button></section></main>
<script>
const artists=[
{name:'Demo Artist',clues:['Age: 31','Label: Example Records','Active since: 2012','Country: 🇳🇱 Netherlands','Genre: Rawstyle','Gender: Male']},
{name:'Demo Artist 2',clues:['Age: 28','Label: Demo Records','Active since: 2015','Country: 🇸🇪 Sweden','Genre: Euphoric hardstyle','Gender: Female']}
];
const $=id=>document.getElementById(id);const normalize=s=>s.toLowerCase().replace(/[^a-z0-9]/g,'');let order=[],round=0,attempts=[],finished=false;
function shuffle(){order=artists.map((_,i)=>i);for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}}
function render(){const artist=artists[order[round]];$('counter').textContent=`Attempts: ${attempts.length} / 6`;$('clues').replaceChildren();artist.clues.slice(0,Math.min(attempts.length+1,6)).forEach(clue=>{const li=document.createElement('li');li.textContent=clue;$('clues').append(li)});$('history').replaceChildren();attempts.forEach(name=>{const li=document.createElement('li');li.textContent=name+(normalize(name)===normalize(artist.name)?' — Correct!':' — Incorrect');$('history').append(li)});$('guess').disabled=finished;$('submit').disabled=finished;$('next').hidden=!finished}
function start(){attempts=[];finished=false;$('guess').value='';$('message').textContent='';render()}
artists.forEach(artist=>{const option=document.createElement('option');option.value=artist.name;$('artists').append(option)});
$('guess-form').addEventListener('submit',event=>{event.preventDefault();if(finished)return;const value=$('guess').value.trim();const selected=artists.find(a=>normalize(a.name)===normalize(value));if(!selected){$('message').textContent='Choose an artist from the suggestions.';return}if(attempts.some(a=>normalize(a)===normalize(value))){$('message').textContent='You already guessed that artist.';return}attempts.push(selected.name);const correct=selected.name===artists[order[round]].name;finished=correct||attempts.length===6;$('message').textContent=correct?'Correct! You found the artist.':finished?`Out of attempts. The artist was ${artists[order[round]].name}.`:'Not quite — a new clue is available.';$('guess').value='';render();if(!finished)$('guess').focus()});
$('next').addEventListener('click',()=>{round++;if(round===order.length){const previous=order[round-1];shuffle();if(order[0]===previous)[order[0],order[1]]=[order[1],order[0]];round=0}start();$('guess').focus()});shuffle();start();
</script></body></html>
