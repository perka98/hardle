<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HARDLE — DJdle</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#050508 url("https://q-dance-network-images.akamaized.net/41347/1764931474-20250629_defqon-1_25_years_of_hardstyle-42_mno.jpg?auto=compress&fit=max&w=1440") center/cover fixed;color:white;font-family:Arial,sans-serif}body:before{content:"";position:fixed;inset:0;background:linear-gradient(#05050866,#050508bb);z-index:-1}a{color:white}main{max-width:600px;margin:auto;padding:20px}.panel{background:#111117ee;border:1px solid #ffffff25;border-radius:24px;padding:20px}h1{text-align:center;font-size:42px;margin:8px 0}p{color:#c4c4ca;line-height:1.4}.board{display:grid;gap:6px;margin:20px 0}.row{display:grid;gap:4px}.cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border:1px solid #ffffff40;font-weight:900;font-size:clamp(12px,3vw,24px);background:#25252c}.green{background:#267647!important}.yellow{background:#9c7e22!important}.gray{background:#45454d!important}.keyboard{display:grid;gap:5px}.keys{display:flex;justify-content:center;gap:4px}button,input{font:inherit}button{border:0;border-radius:6px;background:#62626e;color:white;cursor:pointer;font-weight:700;padding:12px 6px;min-width:0}.keys button{flex:1;max-width:50px;font-size:12px}button:focus-visible,input:focus-visible{outline:3px solid white;outline-offset:2px}input{width:100%;background:#09090e;color:white;border:1px solid #777;border-radius:10px;padding:12px;font-size:16px;margin-bottom:8px}.submit{background:#e21b23;width:100%}#message{min-height:22px;font-size:14px}#countdown{text-align:center;font-size:12px}
</style></head><body><a href="/" style="display:inline-block;margin:16px 18px 0;text-decoration:none;font-weight:700">← Back to menu</a><main><section class="panel"><h1>DJdle</h1><p>Guess today's DJ in six attempts. Green: correct letter and position. Yellow: correct letter, wrong position. Gray: letter not present. Use letters only; spaces and punctuation are removed.</p><p id="length"></p><div id="board" class="board" aria-label="Your guesses"></div><form id="form"><label for="guess">DJ name</label><input id="guess" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Type a DJ name"><button id="submit" class="submit">Guess</button></form><p id="message" role="status" aria-live="polite"></p><div id="keyboard" class="keyboard" aria-label="Keyboard"></div><p id="countdown"></p></section></main><script>
const $=id=>document.getElementById(id);const normalize=s=>s.toUpperCase().replace(/[^A-Z]/g,'');
const names=['Adaro','Adrenalize','Audiofreq','B-Front','Code Black','Demi Kanon','Digital Punk','Dr. Peacock','Fraw','Frontliner','Hard Driver','Headhunterz','Hysta','KELTEK','Krowdexx','Lil Texas','Max Enforcer','Miss K8','N-Vitral','Neophyte','Noisecontrollers','Ophidian','Partyraiser','Paul Elstak','Phuture Noize','Ran-D','Sefa','Showtek','Technoboy','Vertile','Warface','Wildstylez','Zatox'];
const date=now=>new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Stockholm',year:'numeric',month:'2-digit',day:'2-digit'}).format(now);const today=date(new Date());const day=Math.floor(Date.parse(today+'T00:00:00Z')/86400000);const targetName=names[((day-20732)%names.length+names.length)%names.length];const target=normalize(targetName);const key='hardle-djdle-v1-'+today;let guesses=[],ended=false;
function score(word){const result=Array(target.length).fill('gray'),counts={};for(let i=0;i<target.length;i++){if(word[i]===target[i])result[i]='green';else counts[target[i]]=(counts[target[i]]||0)+1}for(let i=0;i<target.length;i++){if(result[i]!=='green'&&counts[word[i]]>0){result[i]='yellow';counts[word[i]]--}}return result}
function render(){ended=guesses.includes(target)||guesses.length>=6;$('board').replaceChildren();const colors={},rank={gray:1,yellow:2,green:3};for(let i=0;i<6;i++){const row=document.createElement('div');row.className='row';row.style.gridTemplateColumns=`repeat(${target.length},minmax(0,1fr))`;const word=guesses[i]||'',marks=word?score(word):[];for(let j=0;j<target.length;j++){const cell=document.createElement('span');cell.className='cell '+(marks[j]||'');cell.textContent=word[j]||'';if(word[j]){cell.setAttribute('aria-label',word[j]+' '+marks[j]);if(!colors[word[j]]||rank[marks[j]]>rank[colors[word[j]]])colors[word[j]]=marks[j]}row.append(cell)}$('board').append(row)}document.querySelectorAll('[data-letter]').forEach(button=>button.className=colors[button.dataset.letter]||'');$('guess').disabled=ended;$('submit').disabled=ended;document.querySelectorAll('.keys button').forEach(b=>b.disabled=ended);if(ended)$('message').textContent=guesses.includes(target)?`Correct! Today's DJ is ${targetName}.`:`Today's DJ was ${targetName}. Come back tomorrow.`}
function load(){try{const data=JSON.parse(localStorage.getItem(key)||'[]');guesses=Array.isArray(data)?data.filter(x=>typeof x==='string'&&x.length===target.length&&names.some(n=>normalize(n)===x)).slice(0,6):[]}catch{guesses=[]}render()}
function submit(){if(date(new Date())!==today){location.reload();return}if(ended)return;const word=normalize($('guess').value);if(word.length!==target.length){$('message').textContent=`Enter a DJ name with ${target.length} letters.`;return}if(!names.some(n=>normalize(n)===word)){$('message').textContent='This DJ is not in the game’s artist list.';return}if(guesses.includes(word)){$('message').textContent='You already guessed that DJ.';return}guesses.push(word);try{localStorage.setItem(key,JSON.stringify(guesses))}catch{}$('guess').value='';$('message').textContent='';render()}
$('form').addEventListener('submit',e=>{e.preventDefault();submit()});$('guess').addEventListener('input',()=>{$('guess').value=normalize($('guess').value).slice(0,target.length)});$('length').textContent=`Today's DJ name has ${target.length} letters.`;$('guess').maxLength=target.length;
for(const letters of ['QWERTYUIOP','ASDFGHJKL','ZXCVBNM']){const row=document.createElement('div');row.className='keys';for(const letter of letters){const b=document.createElement('button');b.type='button';b.textContent=letter;b.dataset.letter=letter;b.onclick=()=>{if(!ended&&$('guess').value.length<target.length)$('guess').value+=letter};row.append(b)}$('keyboard').append(row)}const controls=document.createElement('div');controls.className='keys';for(const text of ['Enter','Delete']){const b=document.createElement('button');b.type='button';b.textContent=text;b.onclick=()=>text==='Enter'?submit():$('guess').value=$('guess').value.slice(0,-1);controls.append(b)}$('keyboard').append(controls);
function countdown(){const now=new Date();if(date(now)!==today){location.reload();return}let lo=now.getTime(),hi=lo+27*3600000;while(hi-lo>1){const mid=Math.floor((lo+hi)/2);if(date(new Date(mid))===today)lo=mid;else hi=mid}const ms=hi-now.getTime();$('countdown').textContent='Next DJ in '+[Math.floor(ms/3600000),Math.floor(ms%3600000/60000),Math.floor(ms%60000/1000)].map(n=>String(n).padStart(2,'0')).join(':')}
load();countdown();setInterval(countdown,1000);window.addEventListener('storage',e=>{if(e.key===key)load()});window.addEventListener('focus',countdown);
</script></body></html>
