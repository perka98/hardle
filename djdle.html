</style></head><body><a href="/" style="display:inline-block;margin:16px 18px 0;text-decoration:none;font-weight:700">← Back to menu</a><main><section class="panel"><h1>DJdle</h1><p id="length"></p><div id="board" class="board" aria-label="Your guesses"></div><input id="guess" type="hidden" value=""><p id="message" role="status" aria-live="polite"></p><div id="keyboard" class="keyboard" aria-label="Keyboard"></div><p id="countdown" hidden></p></section></main><div id="result-modal" class="correctModal" hidden><section class="correctBox" role="dialog" aria-modal="true" aria-labelledby="result-title"><div class="correctTop"><div class="correctIcon">🎉</div><h2 id="result-title" class="correctTitle">CORRECT!</h2><div class="correctSub">You nailed today’s DJ.</div></div><div class="correctBody"><p id="result-name" class="correctTrack"></p><div id="stats" class="statsGrid"></div><p>Guess distribution</p><div id="distribution" class="distribution"></div><p id="share-grid"></p><button id="share" type="button">Copy result</button> <a href="/artist" class="correctClose" style="display:block;text-decoration:none">Next game: Guess the Artist →</a><button id="close-result" class="correctClose" type="button">Continue</button></div></section></div><script>
const $=id=>document.getElementById(id);const normalize=s=>s.toUpperCase().normalize('NFD').replace(/[^A-Z]/g,'');
const names=["Aalst", "Act of Rage", "Adaro", "Adjuzt", "Adrenalize", "Akimbo", "Angerfist", "Atmozfears", "Audiofreq", "Aversion", "B-Front", "Barber", "Bass Modulators", "Big K", "BMBERJCK", "BOMBSQUAD", "Brennan Heart", "Bulletproof", "Code Black", "Complex", "Coone", "Crypsis", "D-Block & S-te-Fan", "D-Charged", "D-Sturb", "Da Tweekaz", "Damaxy", "Darren Styles", "Deadly Guns", "Deepack", "DEEZL", "Deluzion", "Demi Kanon", "Deviation", "Devin Wild", "Digital Punk", "Dimitri K", "Dither", "DJ Isaac", "Dr Donk", "Dr. Peacock", "Dual Damage", "E-Force", "Ecstatic", "EZG", "Fraw", "Frequencerz", "Frontliner", "Galactixx", "Gezellige Uptempo", "Ghost Stories", "GPF", "Hard Driver", "Harris & Ford", "Headhunterz", "HET POMPSTATION", "Hixxy", "Hysta", "Imperatorz", "INVADE", "Invaderz", "Irradiate", "Isaac", "Jay Reeve", "JDX", "Jesse Jax", "Josh & Wesz", "KELTEK", "Kili", "Kronos", "Krowdexx", "Kruelty", "Lekkerfaces", "Levenkhan", "Lil Texas", "LunaKorpz", "Major Conspiracy", "Manifest Destiny", "Max Enforcer", "Mind Compressor", "Mish", "Mutilator", "N-Vitral", "Neophyte", "Never Surrender", "Nightcraft", "Noisecontrollers", "Noiseflow", "Noxiouz", "Odium", "Omnya", "Opgekonkerd", "Ophidian", "Outsiders", "Partyraiser", "Pat B", "Paul Elstak", "Phuture Noize", "Pinotello", "Project One", "Radical Redemption", "Ran-D", "Rebelion", "Regain", "Rejecta", "Restricted", "Revealer", "Rooler", "Roosterz", "Rosbeek", "S-KILL", "Samynator", "Sanctuary", "Satirized", "Sefa", "Serzo", "Showtek", "Sickmode", "So Juice", "Sogma", "Soulblast", "Sound Rush", "Spitnoise", "Sub Sonik", "Sub Zero Project", "T.M.O.", "Technoboy", "Tha Playah", "Tharken", "The Dark Horror", "The Dope Doctor", "The Purge", "The Straikerz", "TNT", "Tommyknocker", "Toneshifterz", "TOZA", "Tuneboy", "Udow", "Unlocked", "Unproven", "Vertile", "Warface", "Wasted Penguinz", "Waverider", "Wesz", "Wildstylez", "Xception", "Zany", "Zatox", "Zyon"];
const date=now=>new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Stockholm',year:'numeric',month:'2-digit',day:'2-digit'}).format(now);const today=date(new Date());const day=Math.floor(Date.parse(today+'T00:00:00Z')/86400000);const targetName=today==='2026-10-06'?'D-Sturb':names[((day-20732)%names.length+names.length)%names.length];const target=normalize(targetName);const key='hardle-djdle-v3-'+today+(today==='2026-10-06'?'-new-name-1750':'');let guesses=[],ended=false,revealing=false;
let englishWords=null;fetch('/data/english-words.json').then(r=>{if(!r.ok)throw new Error('Dictionary unavailable');return r.json()}).then(words=>{englishWords=new Set(words.map(normalize))}).catch(()=>{});
function score(word){const result=Array(word.length).fill('gray'),counts={};for(let i=0;i<target.length;i++){if(word[i]===target[i])result[i]='green';else counts[target[i]]=(counts[target[i]]||0)+1}for(let i=0;i<word.length;i++){if(result[i]!=='green'&&counts[word[i]]>0){result[i]='yellow';counts[word[i]]--}}return result}
function render(animate=false){ended=guesses.includes(target)||guesses.length>=7;$('board').replaceChildren();const colors={},rank={gray:1,yellow:2,green:3};for(let i=0;i<7;i++){const row=document.createElement('div');row.className='row';row.style.setProperty('--letters',target.length);const word=guesses[i]||(!ended&&i===guesses.length?$('guess').value:''),marks=guesses[i]?score(word):[];for(let j=0;j<target.length;j++){const cell=document.createElement('span');cell.className='cell '+(marks[j]||'');cell.textContent=word[j]||'';if(animate&&i===guesses.length-1){cell.classList.add('reveal');cell.style.setProperty('--delay',(j*180)+'ms')}if(marks[j]){cell.setAttribute('aria-label',word[j]+' '+marks[j]);if(!colors[word[j]]||rank[marks[j]]>rank[colors[word[j]]])colors[word[j]]=marks[j]}row.append(cell)}$('board').append(row)}if(!animate)document.querySelectorAll('[data-letter]').forEach(button=>button.className=colors[button.dataset.letter]||'');$('guess').disabled=ended;document.querySelectorAll('.keys button').forEach(b=>b.disabled=ended);if(ended&&!animate)$('message').textContent=guesses.includes(target)?`Correct! Today's DJ is ${targetName}.`:`Today's DJ was ${targetName}. Come back tomorrow.`}
const statsKey='hardle-djdle-stats-v1';let stats={played:0,wins:0,streak:0,best:0,distribution:[0,0,0,0,0,0,0],lastWin:null};try{const saved=JSON.parse(localStorage.getItem(statsKey)||'null');if(saved){stats={...stats,...saved};stats.distribution=Array.from({length:7},(_,i)=>Number(saved.distribution?.[i]||0))}}catch{}
function recordResult(){if(!ended)return;try{if(localStorage.getItem(key+'-recorded'))return;const won=guesses.includes(target);stats.played++;if(won){stats.wins++;const yesterday=new Date(Date.parse(today+'T00:00:00Z')-86400000).toISOString().slice(0,10);stats.streak=stats.lastWin===today?stats.streak:stats.lastWin===yesterday?stats.streak+1:1;stats.best=Math.max(stats.best,stats.streak);stats.lastWin=today;stats.distribution[guesses.length-1]++}else stats.streak=0;localStorage.setItem(statsKey,JSON.stringify(stats));localStorage.setItem(key+'-recorded','1')}catch{}}
function resultText(){return 'DJdle '+today+' '+guesses.length+'/7\n'+guesses.map(word=>score(word).map(c=>({green:'🟩',yellow:'🟨',gray:'⬛'}[c])).join('')).join('\n')}
function showResult(){const won=guesses.includes(target);if(!won){try{localStorage.setItem('hardle-failed-djdle-'+today,'1')}catch{}}document.querySelector('.correctBox').classList.toggle('loss',!won);const feedback=!won?['BETTER LUCK TOMORROW!','🔴','red']:guesses.length<=2?['PERFECT!','🟢🔥','green']:guesses.length===3?['AMAZING!','🟢','green']:guesses.length===4?['NICE!','🟡','yellow']:guesses.length<=6?['WELL DONE!','🟠','orange']:['JUST IN TIME!','🔥','orange'];document.querySelector('.correctBox').dataset.feedback=feedback[2];$('result-title').textContent=feedback[0];document.querySelector('.correctIcon').textContent=feedback[1];document.querySelector('.correctSub').textContent=won?'You found today’s DJ in '+guesses.length+'/7 attempts!':'Here is today’s DJ. Try again tomorrow!';if(won){try{localStorage.setItem('hardle-completed-djdle-'+today,'1')}catch{}}$('result-name').textContent=targetName;$('stats').replaceChildren();for(const [label,value] of [['Played',stats.played],['Win %',stats.played?Math.round(stats.wins/stats.played*100):0],['Streak',stats.streak],['Best streak',stats.best],['Wins',stats.wins],['Today',guesses.length+'/7']]){const div=document.createElement('div'),b=document.createElement('b'),span=document.createElement('span');b.textContent=value;span.textContent=label;div.append(b,span);$('stats').append(div)}$('distribution').replaceChildren();const max=Math.max(1,...stats.distribution);stats.distribution.forEach((count,i)=>{const bar=document.createElement('div');bar.style.width=Math.max(12,count/max*100)+'%';bar.textContent=(i+1)+': '+count;$('distribution').append(bar)});$('share-grid').textContent=resultText();$('result-modal').hidden=false;$('close-result').focus()}
$('close-result').onclick=()=>{$('result-modal').hidden=true};$('share').onclick=async()=>{try{await navigator.clipboard.writeText(resultText());$('share').textContent='Copied!'}catch{$('share').textContent='Copy failed'}};
document.addEventListener('keydown',e=>{if($('result-modal').hidden)return;if(e.key==='Escape')$('result-modal').hidden=true;if(e.key==='Tab'){const first=$('share'),last=$('close-result');if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
function load(){try{const data=JSON.parse(localStorage.getItem(key)||'[]');guesses=Array.isArray(data)?data.filter(x=>typeof x==='string'&&x.length===target.length&&/^[A-Z]+$/.test(x)).slice(0,7):[]}catch{guesses=[]}render()}
function submit(){if(date(new Date())!==today){location.reload();return}if(ended||revealing)return;const word=normalize($('guess').value);if(word.length!==target.length){$('message').textContent=`Enter exactly ${target.length} letters.`;return}if(!names.some(n=>normalize(n)===word)){if(!englishWords){$('message').textContent='Word dictionary is loading. Please try again.';return}if(!englishWords.has(word)){$('message').textContent="This word doesn’t exist.";return}}if(guesses.includes(word)){$('message').textContent='You already guessed that word.';return}guesses.push(word);try{localStorage.setItem(key,JSON.stringify(guesses))}catch{}$('guess').value='';$('message').textContent='';revealing=true;render(true);setTimeout(()=>{revealing=false;render();recordResult();if(ended)showResult()},(target.length-1)*180+450)}
$('guess').addEventListener('input',()=>{$('guess').value=normalize($('guess').value).slice(0,target.length)});$('length').textContent=`Today's DJ name has ${target.length} letters.`;$('guess').maxLength=target.length;
for(const letters of ['QWERTYUIOP','ASDFGHJKL','ZXCVBNM']){const row=document.createElement('div');row.className='keys';for(const letter of letters){const b=document.createElement('button');b.type='button';b.textContent=letter;b.dataset.letter=letter;b.onclick=()=>{if(!ended&&!revealing&&$('guess').value.length<target.length){$('guess').value+=letter;render()}};row.append(b)}$('keyboard').append(row)}const bottomRow=$('keyboard').lastElementChild;for(const text of ['Enter','⌫']){const b=document.createElement('button');b.type='button';b.textContent=text;b.setAttribute('aria-label',text==='Enter'?'Submit guess':'Delete letter');b.style.flex='1.5';b.style.maxWidth='70px';b.onclick=()=>{if(revealing)return;if(text==='Enter')submit();else{$('guess').value=$('guess').value.slice(0,-1);render()}};if(text==='Enter')bottomRow.prepend(b);else bottomRow.append(b)}
document.addEventListener('keydown',event=>{if(ended||revealing||event.ctrlKey||event.metaKey||event.altKey||event.target===$('guess')||event.target.isContentEditable)return;if(/^[a-z]$/i.test(event.key)){event.preventDefault();if($('guess').value.length<target.length){$('guess').value+=event.key.toUpperCase();render()}}else if(event.key==='Backspace'){event.preventDefault();$('guess').value=$('guess').value.slice(0,-1);render()}else if(event.key==='Enter'){event.preventDefault();submit()}});
load();recordResult();if(ended)showResult();countdown();setInterval(countdown,1000);window.addEventListener('storage',e=>{if(e.key===key)load()});window.addEventListener('focus',countdown);
</script></body></html>
