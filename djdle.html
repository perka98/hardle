<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HARDLE — DJdle</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#050508 url("https://q-dance-network-images.akamaized.net/41347/1764931474-20250629_defqon-1_25_years_of_hardstyle-42_mno.jpg?auto=compress&fit=max&w=1440") center/cover fixed;color:white;font-family:Arial,sans-serif}body:before{content:"";position:fixed;inset:0;background:linear-gradient(#05050866,#050508bb);z-index:-1}a{color:white}main{max-width:600px;margin:auto;padding:20px}.panel{background:#111117ee;border:1px solid #ffffff25;border-radius:24px;padding:20px}h1{text-align:center;font-size:42px;margin:8px 0}p{color:#c4c4ca;line-height:1.4}.board{display:grid;gap:6px;margin:20px 0}.row{display:grid;gap:4px}.cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border:1px solid #ffffff40;font-weight:900;font-size:clamp(12px,3vw,24px);background:#25252c}.green{background:#267647!important}.yellow{background:#9c7e22!important}.gray{background:#45454d!important}.keyboard{display:grid;gap:5px}.keys{display:flex;justify-content:center;gap:4px}button,input{font:inherit}button{border:0;border-radius:6px;background:#62626e;color:white;cursor:pointer;font-weight:700;padding:12px 6px;min-width:0}.keys button{flex:1;max-width:50px;font-size:12px}button:focus-visible,input:focus-visible{outline:3px solid white;outline-offset:2px}input{width:100%;background:#09090e;color:white;border:1px solid #777;border-radius:10px;padding:12px;font-size:16px;margin-bottom:8px}.submit{background:#e21b23;width:100%}#message{min-height:22px;font-size:14px}#countdown{text-align:center;font-size:12px}
body{background:#000}body:before{display:none}.panel{background:#000}
.row{overflow-x:auto}.cell{min-width:18px;font-size:clamp(10px,2.5vw,22px)}
main{max-width:540px;padding:16px}.panel{padding:20px 16px}h1{font-size:36px}.board{gap:5px;max-width:460px;margin:18px auto}.row{display:flex;justify-content:center;gap:5px;overflow-x:auto}.cell{flex:0 0 clamp(18px,calc((100vw - 90px) / var(--letters) - 5px),52px);width:52px;height:52px;aspect-ratio:auto;font-size:clamp(12px,2.8vw,26px)}.keys button{height:52px;padding:8px 4px}.keyboard{gap:6px}.keys{gap:5px}
.row{display:grid;grid-template-columns:repeat(var(--letters),minmax(0,1fr));overflow:visible;gap:3px;width:100%;max-width:calc(var(--letters) * 57px);margin:0 auto}.cell{width:100%;min-width:0;flex:none;overflow:hidden;font-size:clamp(10px,2.5vw,24px)}main,.panel,.board{min-width:0}.board{width:100%}
</style></head><body><a href="/" style="display:inline-block;margin:16px 18px 0;text-decoration:none;font-weight:700">← Back to menu</a><main><section class="panel"><h1>DJdle</h1><p id="length"></p><div id="board" class="board" aria-label="Your guesses"></div><input id="guess" type="hidden" value=""><p id="message" role="status" aria-live="polite"></p><div id="keyboard" class="keyboard" aria-label="Keyboard"></div><p id="countdown" hidden></p></section></main><script>
const $=id=>document.getElementById(id);const normalize=s=>s.toUpperCase().normalize('NFD').replace(/[^A-Z]/g,'');
const names=["Act of Rage", "Adaro", "Adrenalize", "Audiofreq", "B-Front", "Brennan Heart", "Code Black", "D-Block & S-te-Fan", "Da Tweekaz", "Demi Kanon", "Digital Punk", "Dr. Peacock", "Dual Damage", "Fraw", "Frontliner", "Hard Driver", "Headhunterz", "Hysta", "KELTEK", "Krowdexx", "Lil Texas", "Max Enforcer", "Miss K8", "N-Vitral", "Neophyte", "Noisecontrollers", "Ophidian", "Partyraiser", "Paul Elstak", "Phuture Noize", "Radical Redemption", "Ran-D", "Sefa", "Showtek", "Sub Zero Project", "Technoboy", "Vertile", "Warface", "Wildstylez", "Zatox", "D-Sturb"];
const date=now=>new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Stockholm',year:'numeric',month:'2-digit',day:'2-digit'}).format(now);const today=date(new Date());const day=Math.floor(Date.parse(today+'T00:00:00Z')/86400000);const targetName=names[((day-20732)%names.length+names.length)%names.length];const target=normalize(targetName);const key='hardle-djdle-v1-'+today;let guesses=[],ended=false;
function score(word){const result=Array(word.length).fill('gray'),counts={};for(let i=0;i<target.length;i++){if(word[i]===target[i])result[i]='green';else counts[target[i]]=(counts[target[i]]||0)+1}for(let i=0;i<word.length;i++){if(result[i]!=='green'&&counts[word[i]]>0){result[i]='yellow';counts[word[i]]--}}return result}
function render(){ended=guesses.includes(target)||guesses.length>=6;$('board').replaceChildren();const colors={},rank={gray:1,yellow:2,green:3};for(let i=0;i<6;i++){const row=document.createElement('div');row.className='row';row.style.setProperty('--letters',(guesses[i]||(!ended&&i===guesses.length&&$('guess').value.length>target.length?$('guess').value:target)).length);const word=guesses[i]||(!ended&&i===guesses.length?$('guess').value:''),marks=guesses[i]?score(word):[];for(let j=0;j<(guesses[i]?word.length:Math.max(target.length,word.length));j++){const cell=document.createElement('span');cell.className='cell '+(marks[j]||'');cell.textContent=word[j]||'';if(marks[j]){cell.setAttribute('aria-label',word[j]+' '+marks[j]);if(!colors[word[j]]||rank[marks[j]]>rank[colors[word[j]]])colors[word[j]]=marks[j]}row.append(cell)}$('board').append(row)}document.querySelectorAll('[data-letter]').forEach(button=>button.className=colors[button.dataset.letter]||'');$('guess').disabled=ended;document.querySelectorAll('.keys button').forEach(b=>b.disabled=ended);if(ended)$('message').textContent=guesses.includes(target)?`Correct! Today's DJ is ${targetName}.`:`Today's DJ was ${targetName}. Come back tomorrow.`}
function load(){try{const data=JSON.parse(localStorage.getItem(key)||'[]');guesses=Array.isArray(data)?data.filter(x=>typeof x==='string'&&names.some(n=>normalize(n)===x)).slice(0,6):[]}catch{guesses=[]}render()}
function submit(){if(date(new Date())!==today){location.reload();return}if(ended)return;const word=normalize($('guess').value);if(!names.some(n=>normalize(n)===word)){$('message').textContent='This DJ is not in the game’s artist list.';return}if(guesses.includes(word)){$('message').textContent='You already guessed that DJ.';return}guesses.push(word);try{localStorage.setItem(key,JSON.stringify(guesses))}catch{}$('guess').value='';$('message').textContent='';render()}
$('guess').addEventListener('input',()=>{$('guess').value=normalize($('guess').value).slice(0,40)});$('length').textContent=`Today's DJ name has ${target.length} letters.`;$('guess').maxLength=40;
for(const letters of ['QWERTYUIOP','ASDFGHJKL','ZXCVBNM']){const row=document.createElement('div');row.className='keys';for(const letter of letters){const b=document.createElement('button');b.type='button';b.textContent=letter;b.dataset.letter=letter;b.onclick=()=>{if(!ended&&$('guess').value.length<40){$('guess').value+=letter;render()}};row.append(b)}$('keyboard').append(row)}const controls=document.createElement('div');controls.className='keys';for(const text of ['Enter','Delete']){const b=document.createElement('button');b.type='button';b.textContent=text;b.onclick=()=>{if(text==='Enter')submit();else{$('guess').value=$('guess').value.slice(0,-1);render()}};controls.append(b)}$('keyboard').append(controls);
function countdown(){const now=new Date();if(date(now)!==today){location.reload();return}let lo=now.getTime(),hi=lo+27*3600000;while(hi-lo>1){const mid=Math.floor((lo+hi)/2);if(date(new Date(mid))===today)lo=mid;else hi=mid}const ms=hi-now.getTime();$('countdown').textContent='Next DJ in '+[Math.floor(ms/3600000),Math.floor(ms%3600000/60000),Math.floor(ms%60000/1000)].map(n=>String(n).padStart(2,'0')).join(':')}
document.addEventListener('keydown',event=>{if(ended||event.ctrlKey||event.metaKey||event.altKey||event.target===$('guess')||event.target.isContentEditable)return;if(/^[a-z]$/i.test(event.key)){event.preventDefault();if($('guess').value.length<40){$('guess').value+=event.key.toUpperCase();render()}}else if(event.key==='Backspace'){event.preventDefault();$('guess').value=$('guess').value.slice(0,-1);render()}else if(event.key==='Enter'){event.preventDefault();submit()}});
load();countdown();setInterval(countdown,1000);window.addEventListener('storage',e=>{if(e.key===key)load()});window.addEventListener('focus',countdown);
</script></body></html>
