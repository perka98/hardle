<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HARDLE — DJdle</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#050508 url("https://q-dance-network-images.akamaized.net/41347/1764931474-20250629_defqon-1_25_years_of_hardstyle-42_mno.jpg?auto=compress&fit=max&w=1440") center/cover fixed;color:white;font-family:Arial,sans-serif}body:before{content:"";position:fixed;inset:0;background:linear-gradient(#05050866,#050508bb);z-index:-1}a{color:white}main{max-width:600px;margin:auto;padding:20px}.panel{background:#111117ee;border:1px solid #ffffff25;border-radius:24px;padding:20px}h1{text-align:center;font-size:42px;margin:8px 0}p{color:#c4c4ca;line-height:1.4}.board{display:grid;gap:6px;margin:20px 0}.row{display:grid;gap:4px}.cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border:1px solid #ffffff40;font-weight:900;font-size:clamp(12px,3vw,24px);background:#25252c}.green{background:#267647}.yellow{background:#9c7e22}.gray{background:#45454d}.keyboard{display:grid;gap:5px}.keys{display:flex;justify-content:center;gap:4px}button,input{font:inherit}button{border:0;border-radius:6px;background:#62626e;color:white;cursor:pointer;font-weight:700;padding:12px 6px;min-width:0}.keys button{flex:1;max-width:50px;font-size:12px}button:focus-visible,input:focus-visible{outline:3px solid white;outline-offset:2px}input{width:100%;background:#09090e;color:white;border:1px solid #777;border-radius:10px;padding:12px;font-size:16px;margin-bottom:8px}.submit{background:#e21b23;width:100%}#message{min-height:22px;font-size:14px}#countdown{text-align:center;font-size:12px}
body{background:#000}body:before{display:none}.panel{background:#000}
.row{overflow-x:auto}.cell{min-width:18px;font-size:clamp(10px,2.5vw,22px)}
main{max-width:540px;padding:16px}.panel{padding:20px 16px}h1{font-size:36px}.board{gap:5px;max-width:460px;margin:18px auto}.row{display:flex;justify-content:center;gap:5px;overflow-x:auto}.cell{flex:0 0 clamp(18px,calc((100vw - 90px) / var(--letters) - 5px),52px);width:52px;height:52px;aspect-ratio:auto;font-size:clamp(12px,2.8vw,26px)}.keys button{height:52px;padding:8px 4px}.keyboard{gap:6px}.keys{gap:5px}
.row{display:grid;grid-template-columns:repeat(var(--letters),minmax(0,1fr));overflow:visible;gap:3px;width:100%;max-width:calc(var(--letters) * 57px);margin:0 auto}.cell{width:100%;min-width:0;flex:none;overflow:hidden;font-size:clamp(10px,2.5vw,24px)}main,.panel,.board{min-width:0}.board{width:100%}
@keyframes tileReveal{0%{transform:rotateX(0);background:#25252c;border-color:#ffffff40}49%{transform:rotateX(90deg);background:#25252c;border-color:#ffffff40}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}.cell.reveal{animation:tileReveal .45s both;animation-delay:var(--delay)}@media(prefers-reduced-motion:reduce){.cell.reveal{animation:none}}
.keys button.gray{background:#25252c;color:#92929c}
</style></head><body><a href="/" style="display:inline-block;margin:16px 18px 0;text-decoration:none;font-weight:700">← Back to menu</a><main><section class="panel"><h1>DJdle</h1><p id="length"></p><div id="board" class="board" aria-label="Your guesses"></div><input id="guess" type="hidden" value=""><p id="message" role="status" aria-live="polite"></p><div id="keyboard" class="keyboard" aria-label="Keyboard"></div><p id="countdown" hidden></p></section></main><script>
const $=id=>document.getElementById(id);const normalize=s=>s.toUpperCase().normalize('NFD').replace(/[^A-Z]/g,'');
const names=["Aalst", "Act of Rage", "Adaro", "Adjuzt", "Adrenalize", "Akimbo", "Angerfist", "Atmozfears", "Audiofreq", "Aversion", "B-Front", "Barber", "Bass Modulators", "Big K", "BMBERJCK", "BOMBSQUAD", "Brennan Heart", "Bulletproof", "Code Black", "Complex", "Coone", "Crypsis", "D-Block & S-te-Fan", "D-Charged", "D-Sturb", "Da Tweekaz", "Damaxy", "Darren Styles", "Deadly Guns", "Deepack", "DEEZL", "Deluzion", "Demi Kanon", "Deviation", "Devin Wild", "Digital Punk", "Dimitri K", "Dither", "DJ Isaac", "Dr Donk", "Dr. Peacock", "Dual Damage", "E-Force", "Ecstatic", "EZG", "Fraw", "Frequencerz", "Frontliner", "Galactixx", "Gezellige Uptempo", "Ghost Stories", "GPF", "Hard Driver", "Harris & Ford", "Headhunterz", "HET POMPSTATION", "Hixxy", "Hysta", "Imperatorz", "INVADE", "Invaderz", "Irradiate", "Isaac", "Jay Reeve", "JDX", "Jesse Jax", "Josh & Wesz", "KELTEK", "Kili", "Kronos", "Krowdexx", "Kruelty", "Lekkerfaces", "Levenkhan", "Lil Texas", "LunaKorpz", "Major Conspiracy", "Manifest Destiny", "Max Enforcer", "Mind Compressor", "Mish", "Mutilator", "N-Vitral", "Neophyte", "Never Surrender", "Nightcraft", "Noisecontrollers", "Noiseflow", "Noxiouz", "Odium", "Omnya", "Opgekonkerd", "Ophidian", "Outsiders", "Partyraiser", "Pat B", "Paul Elstak", "Phuture Noize", "Pinotello", "Project One", "Radical Redemption", "Ran-D", "Rebelion", "Regain", "Rejecta", "Restricted", "Revealer", "Rooler", "Roosterz", "Rosbeek", "S-KILL", "Samynator", "Sanctuary", "Satirized", "Sefa", "Serzo", "Showtek", "Sickmode", "So Juice", "Sogma", "Soulblast", "Sound Rush", "Spitnoise", "Sub Sonik", "Sub Zero Project", "T.M.O.", "Technoboy", "Tha Playah", "Tharken", "The Dark Horror", "The Dope Doctor", "The Purge", "The Straikerz", "TNT", "Tommyknocker", "Toneshifterz", "TOZA", "Tuneboy", "Udow", "Unlocked", "Unproven", "Vertile", "Warface", "Wasted Penguinz", "Waverider", "Wesz", "Wildstylez", "Xception", "Zany", "Zatox", "Zyon"];
const date=now=>new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Stockholm',year:'numeric',month:'2-digit',day:'2-digit'}).format(now);const today=date(new Date());const day=Math.floor(Date.parse(today+'T00:00:00Z')/86400000);const targetName=names[((day-20732)%names.length+names.length)%names.length];const target=normalize(targetName);const key='hardle-djdle-v3-'+today;let guesses=[],ended=false,revealing=false;
let englishWords=null;fetch('/data/english-words.json').then(r=>{if(!r.ok)throw new Error('Dictionary unavailable');return r.json()}).then(words=>{englishWords=new Set(words.map(normalize))}).catch(()=>{});
function score(word){const result=Array(word.length).fill('gray'),counts={};for(let i=0;i<target.length;i++){if(word[i]===target[i])result[i]='green';else counts[target[i]]=(counts[target[i]]||0)+1}for(let i=0;i<word.length;i++){if(result[i]!=='green'&&counts[word[i]]>0){result[i]='yellow';counts[word[i]]--}}return result}
function render(animate=false){ended=guesses.includes(target)||guesses.length>=6;$('board').replaceChildren();const colors={},rank={gray:1,yellow:2,green:3};for(let i=0;i<6;i++){const row=document.createElement('div');row.className='row';row.style.setProperty('--letters',target.length);const word=guesses[i]||(!ended&&i===guesses.length?$('guess').value:''),marks=guesses[i]?score(word):[];for(let j=0;j<target.length;j++){const cell=document.createElement('span');cell.className='cell '+(marks[j]||'');cell.textContent=word[j]||'';if(animate&&i===guesses.length-1){cell.classList.add('reveal');cell.style.setProperty('--delay',(j*180)+'ms')}if(marks[j]){cell.setAttribute('aria-label',word[j]+' '+marks[j]);if(!colors[word[j]]||rank[marks[j]]>rank[colors[word[j]]])colors[word[j]]=marks[j]}row.append(cell)}$('board').append(row)}if(!animate)document.querySelectorAll('[data-letter]').forEach(button=>button.className=colors[button.dataset.letter]||'');$('guess').disabled=ended;document.querySelectorAll('.keys button').forEach(b=>b.disabled=ended);if(ended&&!animate)$('message').textContent=guesses.includes(target)?`Correct! Today's DJ is ${targetName}.`:`Today's DJ was ${targetName}. Come back tomorrow.`}
function load(){try{const data=JSON.parse(localStorage.getItem(key)||'[]');guesses=Array.isArray(data)?data.filter(x=>typeof x==='string'&&x.length===target.length&&/^[A-Z]+$/.test(x)).slice(0,6):[]}catch{guesses=[]}render()}
function submit(){if(date(new Date())!==today){location.reload();return}if(ended||revealing)return;const word=normalize($('guess').value);if(word.length!==target.length){$('message').textContent=`Enter exactly ${target.length} letters.`;return}if(!names.some(n=>normalize(n)===word)){if(!englishWords){$('message').textContent='Word dictionary is loading. Please try again.';return}if(!englishWords.has(word)){$('message').textContent="This word doesn’t exist.";return}}if(guesses.includes(word)){$('message').textContent='You already guessed that word.';return}guesses.push(word);try{localStorage.setItem(key,JSON.stringify(guesses))}catch{}$('guess').value='';$('message').textContent='';revealing=true;render(true);setTimeout(()=>{revealing=false;render()},(target.length-1)*180+450)}
$('guess').addEventListener('input',()=>{$('guess').value=normalize($('guess').value).slice(0,target.length)});$('length').textContent=`Today's DJ name has ${target.length} letters.`;$('guess').maxLength=target.length;
for(const letters of ['QWERTYUIOP','ASDFGHJKL','ZXCVBNM']){const row=document.createElement('div');row.className='keys';for(const letter of letters){const b=document.createElement('button');b.type='button';b.textContent=letter;b.dataset.letter=letter;b.onclick=()=>{if(!ended&&!revealing&&$('guess').value.length<target.length){$('guess').value+=letter;render()}};row.append(b)}$('keyboard').append(row)}const bottomRow=$('keyboard').lastElementChild;for(const text of ['Enter','⌫']){const b=document.createElement('button');b.type='button';b.textContent=text;b.setAttribute('aria-label',text==='Enter'?'Submit guess':'Delete letter');b.style.flex='1.5';b.style.maxWidth='70px';b.onclick=()=>{if(revealing)return;if(text==='Enter')submit();else{$('guess').value=$('guess').value.slice(0,-1);render()}};if(text==='Enter')bottomRow.prepend(b);else bottomRow.append(b)}
document.addEventListener('keydown',event=>{if(ended||revealing||event.ctrlKey||event.metaKey||event.altKey||event.target===$('guess')||event.target.isContentEditable)return;if(/^[a-z]$/i.test(event.key)){event.preventDefault();if($('guess').value.length<target.length){$('guess').value+=event.key.toUpperCase();render()}}else if(event.key==='Backspace'){event.preventDefault();$('guess').value=$('guess').value.slice(0,-1);render()}else if(event.key==='Enter'){event.preventDefault();submit()}});
load();countdown();setInterval(countdown,1000);window.addEventListener('storage',e=>{if(e.key===key)load()});window.addEventListener('focus',countdown);
</script></body></html>
