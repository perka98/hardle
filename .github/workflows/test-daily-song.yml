name: test-daily-song

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  change-song:
    if: "!contains(github.event.head_commit.message, 'Apply test daily song')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Change test song
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text()
          old = "let DAILY_INDEX=6;"
          new = "let DAILY_INDEX=7;"
          if old not in s:
              raise SystemExit("DAILY_INDEX=6 not found")
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Apply test daily song"
          git push
