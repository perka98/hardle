<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hardle — Account</title><style>*{box-sizing:border-box}body{background:#000;color:#fff;font:16px Arial;margin:0}main{max-width:650px;margin:auto;padding:24px 18px}a{color:#ddd}.panel{background:#121217;border:1px solid #ffffff25;border-radius:18px;padding:20px;margin:18px 0}input,button,select{font:inherit;border-radius:9px;padding:12px}label{display:block;margin:10px 0 5px}input,textarea,select{width:100%;background:#09090d;color:white;border:1px solid #555}textarea{resize:vertical}form button{margin-top:14px}button{background:#86212a;color:white;border:0;cursor:pointer;margin:12px 6px 0 0}p{color:#aaa;line-height:1.5;font-size:14px}table{width:100%;border-collapse:collapse}td,th{padding:10px;text-align:left;border-bottom:1px solid #ffffff15}select{background:#222;color:white}[hidden]{display:none!important}</style></head><body><main><a href="/">← Back to menu</a><h1>Account</h1><p>Play as a guest, or create an account to join the leaderboard once competitive scoring is enabled.</p><section class="panel" id="auth-panel"><form id="auth-form"><label for="username">Username (for registration)</label><input id="username" autocomplete="nickname" maxlength="24"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required maxlength="254"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" minlength="12" required><button type="submit">Sign in</button><button type="button" id="register">Create account</button></form></section><section class="panel" id="signed-in" hidden><p id="identity"></p>
<h2>My Profile</h2>
<p>Add a little info about yourself. Your profile can be shown alongside your Hardle identity.</p>
<form id="profile-form">
<label for="profile-name">Name</label><input id="profile-name" maxlength="40" autocomplete="name" placeholder="Your name">
<label for="profile-country">Country</label><select id="profile-country"><option value="">Select country</option><option>Sweden</option><option>Norway</option><option>Denmark</option><option>Finland</option><option>Germany</option><option>Netherlands</option><option>United Kingdom</option><option>United States</option><option>Other</option></select>
<label for="profile-dj">Favorite DJ</label><input id="profile-dj" maxlength="60" placeholder="e.g. Headhunterz">
<label for="profile-track">Favorite Hardstyle Track</label><input id="profile-track" maxlength="100" placeholder="e.g. Lost Without You">
<label for="profile-bio">About me</label><textarea id="profile-bio" maxlength="300" rows="4" placeholder="Tell the Hardle community a little about yourself..."></textarea>
<button type="submit" id="save-profile">Save Profile</button><span id="profile-saved" hidden style="display:inline-block;margin-left:10px;color:#53e48a;font-size:13px;font-weight:700;vertical-align:middle">✓ Profile saved</span>
</form>
<button id="sign-out">Sign out</button></section><section class="panel" id="verified-stats-panel" hidden><h2>Verified Stats</h2><p id="verified-stats" role="status"></p><details><summary>Verified score history</summary><div id="verified-history"></div></details></section><p id="message" role="status" aria-live="polite"></p></main><script src="/account-config.js"></script><script src="/account.js"></script></body></html>
