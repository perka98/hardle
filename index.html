<!doctype html><html lang="sv"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>HARDLE</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(rgba(5,5,8,.72),rgba(5,5,8,.88)),url('https://commons.wikimedia.org/wiki/Special:FilePath/RED_DEFQON1_2025.jpg') center/cover fixed;color:#fff;font-family:Arial,sans-serif}.page{width:min(1080px,100%);margin:auto;padding:28px 18px 50px}header{text-align:center;margin-bottom:26px}.logo{font-size:clamp(52px,9vw,86px);font-weight:1000;letter-spacing:-6px;text-shadow:0 5px 25px #000}.logo span{color:#e21b23}.tag{color:#d4d4d8;text-transform:uppercase;letter-spacing:2px;font-weight:700;margin-top:8px;text-shadow:0 2px 10px #000}.card{position:relative;background:#111117dd;border:1px solid #ffffff25;border-radius:24px;padding:22px;box-shadow:0 24px 70px #000a;backdrop-filter:blur(3px)}.hero{display:grid;grid-template-columns:.82fr 1.18fr;gap:22px;align-items:center}.art{min-height:270px;border-radius:18px;background:linear-gradient(135deg,#4a080dcc,#e21b2388 50%,#08080add);display:grid;place-items:center;overflow:hidden}.disc{width:125px;height:125px;border-radius:50%;border:9px solid #18181b;background:repeating-radial-gradient(circle,#303035 0 4px,#111114 5px 9px);box-shadow:0 0 60px #e21b23aa}.panel{display:flex;flex-direction:column;justify-content:center}.eyebrow{color:#ff4b52;font-weight:900;letter-spacing:2px;font-size:13px;text-transform:uppercase}h1{font-size:clamp(34px,5vw,56px);line-height:.95;margin:10px 0 16px}.desc{color:#c4c4ca;line-height:1.6;margin:0 0 22px}.play{border:0;border-radius:14px;padding:16px 20px;background:#e21b23;color:white;font-weight:900;font-size:16px;cursor:pointer}.play.playing{background:#a80f16}.play:disabled{opacity:.55;cursor:default}.guessBox{position:relative;margin-top:18px;height:132px}.guessInput{display:block;width:100%;height:54px;min-height:54px;max-height:54px;border:1px solid #ffffff1c;border-radius:13px;background:#101014;color:#fff;padding:0 112px 0 16px;font-size:15px;font-weight:700;outline:none;box-shadow:none;field-sizing:fixed;line-height:54px}.guessInput:focus{border-color:#e21b23;box-shadow:0 0 0 3px #e21b2322;outline:none}.guessInput:disabled{opacity:.55}.guessSubmit{position:absolute;right:6px;top:6px;height:42px;border:0;border-radius:9px;background:#e21b23;color:#fff;font-weight:900;padding:0 14px;cursor:pointer}.guessSubmit:disabled{opacity:.5;cursor:default}.results{position:absolute;left:0;right:0;top:63px;display:grid;gap:7px;max-height:70px;overflow:hidden;z-index:10}.result{border:1px solid #ffffff16;background:#0d0d11;border-radius:10px;padding:10px 12px;cursor:pointer;color:#ddd;min-height:0}.result:hover{border-color:#e21b23;background:#151519}.guessHeader,.guessRow{display:grid;grid-template-columns:1.5fr 1.25fr .8fr 1fr .65fr;gap:6px;align-items:stretch}.guessHeader{margin-top:12px;color:#777782;font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.8px;text-align:center}.guessHeader div{padding:5px 3px}.guessList{display:grid;gap:7px;margin-top:6px}.guessCell{min-width:0;min-height:46px;display:flex;align-items:center;justify-content:center;text-align:center;border:1px solid #ffffff16;border-radius:9px;background:#101014cc;padding:7px 6px;font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis}.guessCell.title{text-align:left;justify-content:flex-start}.guessRow.correct .guessCell{border-color:#38d27a}.guessRow.wrong .guessCell{border-color:#e21b23}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.stat{background:#101014cc;border:1px solid #ffffff18;border-radius:15px;text-align:center;padding:17px}.stat b{display:block;font-size:25px}.stat span{color:#a1a1aa;font-size:11px;text-transform:uppercase;letter-spacing:1px}footer{text-align:center;color:#a1a1aa;margin-top:22px;font-size:12px}.volume{position:absolute;top:11px;right:11px;z-index:5;display:flex;align-items:center;gap:4px;padding:3px 5px;background:#08080dcc;border:1px solid #ffffff15;border-radius:7px;box-shadow:0 4px 12px #0006;backdrop-filter:blur(4px)}.volume button{width:23px;height:23px;border:0;border-radius:5px;background:#e21b23;color:#fff;font-size:11px;cursor:pointer;display:grid;place-items:center}.volume input{width:48px;height:12px;accent-color:#e21b23;cursor:pointer}.volume button:hover{filter:brightness(1.15)}#sc-player{position:fixed;width:1px;height:1px;left:-10px;bottom:-10px;border:0;opacity:0;pointer-events:none}@media(max-width:720px){.hero{grid-template-columns:1fr}.art{min-height:210px}.stats{grid-template-columns:1fr 1fr 1fr}.page{padding:18px 12px 40px}.volume{top:9px;right:9px}.volume input{width:40px}.guessHeader,.guessRow{grid-template-columns:1.35fr 1.1fr .75fr .9fr .6fr}.guessCell{font-size:10px;min-height:42px;padding:6px 3px}}</style></head><body><main class="page"><header><div class="logo">HARD<span>LE</span></div><div class="tag">Guess the hardstyle track of the day</div></header><section class="card hero"><div class="volume"><button id="volumeBtn" aria-label="Volym">🔊</button><input id="volumeSlider" type="range" min="0" max="100" value="35" aria-label="Volym"></div><div class="art"><div class="disc"></div></div><div class="panel"><div class="eyebrow">Daily #001</div><h1>Can you recognize the track?</h1><p class="desc">Listen to a short preview, search for a track, and submit your guess.</p><button class="play" id="start">▶ Play 5s preview</button><div class="guessBox"><input id="guessInput" class="guessInput" autocomplete="off" placeholder="Sök efter artist eller låt..." aria-label="Sök efter låt"><button id="guessSubmit" class="guessSubmit">Gissa</button><div id="results" class="results"></div></div><div class="guessHeader"><div>Låt</div><div>Artist</div><div>Land</div><div>Genre</div><div>År</div></div><div id="guessList" class="guessList"></div></div></section><section class="stats"><div class="stat"><b>0</b><span>Played</span></div><div class="stat"><b>0</b><span>Streak</span></div><div class="stat"><b>—</b><span>Best</span></div></section><footer>HARDLE • A daily hardstyle guessing game</footer></main><iframe id="sc-player" scrolling="no" allow="autoplay" src="https://w.soundcloud.com/player/?url=https%3A%2F%2Fsoundcloud.com%2Fq-dancemusic&auto_play=false&hide_related=true&show_comments=false&show_user=false&show_reposts=false&show_teaser=false&visual=false&color=%23e21b23"></iframe><script src="https://w.soundcloud.com/player/api.js"></script><script>const volumeBtn=document.getElementById('volumeBtn'),volumeSlider=document.getElementById('volumeSlider'),start=document.getElementById('start'),guessInput=document.getElementById('guessInput'),guessSubmit=document.getElementById('guessSubmit'),results=document.getElementById('results'),guessList=document.getElementById('guessList'),widget=SC.Widget(document.getElementById('sc-player'));let scReady=false,trackIndex=null,round=0,playing=false,stopTimer=null,soundPool=[],selectedGuess=null;const previewTimes=[5,10,15],defaultVolume=35;widget.bind(SC.Widget.Events.READY,()=>{scReady=true;widget.setVolume(defaultVolume);loadSounds();});volumeBtn.onclick=()=>{volumeSlider.value=volumeSlider.value==='0'?defaultVolume:'0';volumeBtn.textContent=volumeSlider.value==='0'?'🔇':'🔊';if(scReady)widget.setVolume(Number(volumeSlider.value));};volumeSlider.oninput=()=>{volumeBtn.textContent=volumeSlider.value==='0'?'🔇':'🔊';if(scReady)widget.setVolume(Number(volumeSlider.value));};function dailyIndex(count){const d=new Date(),key=d.getUTCFullYear()*10000+(d.getUTCMonth()+1)*100+d.getUTCDate();return Math.abs((key*9301+49297)%233280)%Math.min(400,count);}const artistSources=['https://soundcloud.com/headhunterz','https://soundcloud.com/subzeroproject','https://soundcloud.com/dbstf','https://soundcloud.com/wildstylez','https://soundcloud.com/randmusic','https://soundcloud.com/dj-brennan-heart','https://soundcloud.com/phuture-noize','https://soundcloud.com/warface','https://soundcloud.com/dsturb','https://soundcloud.com/rebelion','https://soundcloud.com/vertile','https://soundcloud.com/soundrush','https://soundcloud.com/atmozfears','https://soundcloud.com/noisecontrollers','https://soundcloud.com/frontliner','https://soundcloud.com/coone','https://soundcloud.com/zatox','https://soundcloud.com/radicalredemption','https://soundcloud.com/b-front','https://soundcloud.com/rejecta','https://soundcloud.com/actofrage','https://soundcloud.com/adaro','https://soundcloud.com/e-force','https://soundcloud.com/keltek','https://soundcloud.com/devinwild','https://soundcloud.com/thepurge','https://soundcloud.com/mutilator','https://soundcloud.com/adjuzt','https://soundcloud.com/rooler','https://soundcloud.com/sickmode','https://soundcloud.com/dualdamage','https://soundcloud.com/aversion'];let sourcePos=0,loadingSources=false;function cleanOfficial(s){const t=(s.title||'').toLowerCase();const g=(s.genre||'').toLowerCase();return (/hardstyle|rawstyle|hard dance|hardcore/.test(g)||/hardstyle|rawstyle/.test(t))&&!/\b(live|liveset|set|podcast|yearmix|bootleg|mashup|megamix|dj mix|mix series)\b/i.test(t)&&!!s.permalink_url;}function loadSounds(){soundPool=[];sourcePos=0;loadingSources=true;loadNextSource();}function loadWidget(url,callback){widget.load(url,{auto_play:false,callback:callback});}function loadNextSource(){if(sourcePos>=artistSources.length){loadingSources=false;if(soundPool.length){const unique=[];const seen=new Set();for(const s of soundPool){if(!seen.has(s.id)){seen.add(s.id);unique.push(s);}}soundPool=unique;trackIndex=dailyIndex(soundPool.length);guessInput.disabled=false;guessSubmit.disabled=false;const target=soundPool[trackIndex];if(target)loadWidget(target.permalink_url,()=>{widget.setVolume(Number(volumeSlider.value));});}return;}const url=artistSources[sourcePos++];loadWidget(url,()=>{widget.getSounds(sounds=>{soundPool.push(...(sounds||[]).filter(cleanOfficial));loadNextSource();});});}function stopPreview(){if(stopTimer){clearTimeout(stopTimer);stopTimer=null}if(scReady)widget.pause();playing=false;start.classList.remove('playing');if(round<previewTimes.length)start.textContent='▶ Play '+previewTimes[round]+'s preview';else{start.textContent='✓ All previews unlocked';start.disabled=true;}}function playPreview(){if(!scReady||trackIndex===null||playing)return;const seconds=previewTimes[round],target=soundPool[trackIndex];if(!target||!target.permalink_url)return;playing=true;start.textContent='⏸ Playing '+seconds+'s preview';start.classList.add('playing');loadWidget(target.permalink_url,()=>{widget.setVolume(Number(volumeSlider.value));widget.seekTo(0);widget.play();stopTimer=setTimeout(()=>{stopPreview();if(round<previewTimes.length-1)round++;},seconds*1000);});}start.onclick=()=>{if(!scReady||trackIndex===null)return;if(playing)stopPreview();else playPreview();};function normalize(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9åäö]+/g,' ').trim();}function renderResults(){const q=normalize(guessInput.value);if(!q||!soundPool.length){results.innerHTML='';return;}const words=q.split(/\s+/);const matches=soundPool.filter(s=>words.every(w=>normalize((s.user&&s.user.username||'')+' '+(s.title||'')).includes(w))).slice(0,3);results.innerHTML=matches.map((s,i)=>'<div class="result"><b>'+escapeHtml(s.title||'Unknown')+'</b></div>').join('');results.querySelectorAll('.result').forEach((el,i)=>el.onclick=()=>{selectedGuess=matches[i];guessInput.value=selectedGuess.title||'';results.innerHTML='';});}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function meta(s){const artist=s.user&&s.user.username?s.user.username:'—',genre=s.genre||'Hardstyle';return {title:s.title||'—',artist,country:'—',genre,year:s.release_year||s.release_date?.slice(0,4)||'—'};}guessInput.addEventListener('input',()=>{selectedGuess=null;renderResults();});guessInput.addEventListener('keydown',e=>{if(e.key==='Enter')submitGuess();});guessSubmit.onclick=submitGuess;function submitGuess(){if(!selectedGuess){const q=normalize(guessInput.value);if(!q)return;selectedGuess=soundPool.find(s=>normalize((s.user&&s.user.username||'')+' '+(s.title||'')).includes(q));if(!selectedGuess)return;}const target=soundPool[trackIndex],correct=selectedGuess.id===target.id,m=meta(selectedGuess),row=document.createElement('div');row.className='guessRow '+(correct?'correct':'wrong');row.innerHTML='<div class="guessCell title">'+escapeHtml(m.title)+'</div><div class="guessCell">'+escapeHtml(m.artist)+'</div><div class="guessCell">'+escapeHtml(m.country)+'</div><div class="guessCell">'+escapeHtml(m.genre)+'</div><div class="guessCell">'+escapeHtml(m.year)+'</div>';guessList.prepend(row);if(correct){guessInput.disabled=true;guessSubmit.disabled=true;results.innerHTML='';start.disabled=true;start.textContent='✓ Correct!';}else{guessInput.value='';selectedGuess=null;results.innerHTML='';}}widget.bind(SC.Widget.Events.FINISH,stopPreview);</script></body></html>
