<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>HARDLE</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#050508;color:#fff;font-family:Arial,sans-serif}.page{width:min(1080px,100%);margin:auto;padding:28px 18px 50px}header{text-align:center;margin-bottom:26px}.logo{font-size:clamp(52px,9vw,86px);font-weight:1000;letter-spacing:-6px;text-shadow:0 5px 25px #000}.logo span{color:#e21b23}.tag{color:#d4d4d8;text-transform:uppercase;letter-spacing:2px;font-weight:700;margin-top:8px}.card{position:relative;background:#111117dd;border:1px solid #ffffff25;border-radius:24px;padding:22px;box-shadow:0 24px 70px #000a}.hero{display:grid;grid-template-columns:.82fr 1.18fr;gap:22px;align-items:start}.art{height:270px;min-height:270px;overflow:hidden;border-radius:18px;background:linear-gradient(135deg,#4a080dcc,#e21b2388 50%,#08080add);display:grid;place-items:center}.disc{width:125px;height:125px;border-radius:50%;border:9px solid #18181b;background:repeating-radial-gradient(circle,#303035 0 4px,#111114 5px 9px);box-shadow:0 0 60px #e21b23aa}.panel{display:flex;flex-direction:column;min-width:0}.eyebrow{color:#ff4b52;font-weight:900;letter-spacing:2px;font-size:13px;text-transform:uppercase}h1{font-size:clamp(34px,5vw,56px);line-height:.95;margin:10px 0 16px}.desc{color:#c4c4ca;line-height:1.6;margin:0 0 22px}.play{border:0;border-radius:14px;padding:16px 20px;background:#e21b23;color:white;font-weight:900;font-size:16px}.play:disabled{opacity:.55}.guessBox{position:relative;margin-top:18px;height:72px}.guessInput{display:block;width:100%;height:54px;border:1px solid #ffffff1c;border-radius:13px;background:#101014;color:#fff;padding:0 112px 0 16px;font-size:15px;font-weight:700;outline:none;line-height:54px}.guessSubmit{position:absolute;right:6px;top:6px;height:42px;border:0;border-radius:9px;background:#e21b23;color:#fff;font-weight:900;padding:0 14px}.results{position:absolute;left:0;right:0;top:63px;display:grid;grid-auto-rows:48px;gap:3px;height:300px;max-height:300px;overflow-y:auto;z-index:10}.result{border:1px solid #ffffff16;background:#0d0d11;border-radius:10px;padding:6px 12px;cursor:pointer;color:#ddd;height:48px;display:flex;flex-direction:column;justify-content:center;gap:2px}.resultArtist{color:#999;line-height:16px}.guessHeader,.guessRow{display:grid;grid-template-columns:1.5fr 1.25fr .8fr 1fr .65fr;gap:6px;align-items:stretch}.guessHeader{margin-top:12px;color:#777782;font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.8px;text-align:center}.guessHeader div{padding:5px 3px}.guessList{display:grid;gap:7px;margin-top:6px}.guessCell{min-width:0;min-height:46px;display:flex;align-items:center;justify-content:center;text-align:center;border:1px solid #ffffff16;border-radius:9px;background:#101014cc;padding:7px 6px;font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis}.guessCell.match{background:#163b27;border-color:#38d27a;color:#d9ffe8}.guessCell.close{background:#4a3b08;border-color:#e8c63a;color:#fff3a8}.guessCell.title{text-align:left;justify-content:flex-start}.guessCell.noMatch{background:#101014cc;color:#aaa}.guessRow.correct .guessCell{border-color:#38d27a}.flag{width:28px;height:19px;border-radius:2px;display:inline-block;box-shadow:0 0 0 1px #ffffff22}.flag-nl{background:linear-gradient(to bottom,#ae1c28 0 33.33%,#fff 33.33% 66.66%,#21468b 66.66%)}.flag-be{background:linear-gradient(to right,#111 0 33.33%,#f7d117 33.33% 66.66%,#ed2939 66.66%)}.flag-it{background:linear-gradient(to right,#009246 0 33.33%,#fff 33.33% 66.66%,#ce2b37 66.66%)}.flag-no{background:#ba0c2f;position:relative}.flag-no:before{content:"";position:absolute;left:0;top:38%;width:100%;height:24%;background:#fff}.flag-no:after{content:"";position:absolute;left:31%;top:0;width:24%;height:100%;background:#fff;box-shadow:inset 0 0 0 5px #00205b}.flag-scotland{background:#005eb8;position:relative}.flag-sc </style></head><body><main class="page"><header><div class="logo">HARD<span>LE</span></div><div class="tag">Guess the hardstyle track of the day</div></header><section class="card hero"><div class="art"><div class="disc"></div></div><div class="panel"><div class="eyebrow">Daily #001</div><h1>Can you recognize the track?</h1><p class="desc">Listen to a short preview, search for a track, and submit your guess.</p><button class="play" id="start" disabled>Audio unavailable</button><div class="guessBox"><input id="guessInput" class="guessInput" autocomplete="off" placeholder="Search for a track..."><button id="guessSubmit" class="guessSubmit">Guess</button><div id="results" class="results"></div></div><div class="guessHeader"><div>Track</div><div>Artist</div><div>Country</div><div>Genre</div><div>Year</div></div><div id="guessList" class="guessList"></div></div></section><section class="stats"><div class="stat"><b>0</b><span>Played</span></div><div class="stat"><b>0</b><span>Streak</span></div><div class="stat"><b>0</b><span>Best</span></div></section><footer>HARDLE • A daily hardstyle guessing game</footer></main><script>
const start=document.getElementById('start'),guessInput=document.getElementById('guessInput'),guessSubmit=document.getElementById('guessSubmit'),results=document.getElementById('results'),guessList=document.getElementById('guessList');const DAILY_INDEX=0,MAX_GUESSES=6;let target,guesses=0,gameOver=false,won=false;const statsKey='hardle-stats-v1',stats=JSON.parse(localStorage.getItem(statsKey)||'{"played":0,"wins":0,"streak":0,"best":0}');
function renderStats(){document.querySelector('.stats').innerHTML='<div class="stat"><b>'+stats.played+'</b><span>Played</span></div><div class="stat"><b>'+stats.streak+'</b><span>Streak</span></div><div class="stat"><b>'+stats.best+'</b><span>Best</span></div>'}function saveStats(){localStorage.setItem(statsKey,JSON.stringify(stats));renderStats()}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function norm(s){return String(s).toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').replace(/[^a-z0-9åäö]+/g,' ').trim()}
function cellClass(value,targetValue,index){if(index===4){const d=Math.abs(Number(value)-Number(targetValue));return d===0?'match':d<=2?'close':'noMatch'}if(index===2)return norm(value)===norm(targetValue)?'match':isCountryClose(value,targetValue)?'close':'noMatch';return norm(value)===norm(targetValue)?'match':'noMatch'}
const countryCoords={NL:[52.13,5.29],BE:[50.85,4.35],IT:[41.87,12.57],NO:[64.0,10.0],GB:[55.38,-3.44],SC:[56.49,-4.2],UA:[48.38,31.17]};function distance(a,b){const A=countryCoords[a],B=countryCoords[b];if(!A||!B)return Infinity;const r=6371,dLat=(B[0]-A[0])*Math.PI/180,dLon=(B[1]-A[1])*Math.PI/180;const x=Math.sin(dLat/2)**2+Math.cos(A[0]*Math.PI/180)*Math.cos(B[0]*Math.PI/180)*Math.sin(dLon/2)**2;return 2*r*Math.asin(Math.sqrt(x))}function isCountryClose(a,b){return a!==b&&distance(a,b)<=900}
function flag(v){return v==='NL'?'<span class="flag flag-nl"></span>':v==='BE'?'<span class="flag flag-be"></span>':v==='IT'?'<span class="flag flag-it"></span>':v==='NO'?'<span class="flag flag-no"></span>':v==='SC'?'<span class="flag flag-scotland"></span>':v==='UA'?'<span class="flag flag-ua"></span>':'—'}
function finishGame(success){gameOver=true;won=success;guessInput.disabled=true;guessSubmit.disabled=true;stats.played++;if(success){stats.wins++;stats.streak++;stats.best=Math.max(stats.best,stats.streak)}else stats.streak=0;saveStats();const box=document.createElement('div');box.className='gameResult '+(success?'success':'');box.innerHTML='<b>'+(success?'🔥 Correct!':'Game over')+'</b><span>'+(success?'You got it in '+guesses+' '+(guesses===1?'guess':'guesses')+'.':'The track was <strong>'+esc(target[0])+'</strong> by '+esc(target[1])+'.')+'</span>';document.querySelector('.panel').appendChild(box)}
renderStats();const songs=[["Lost Without You","Headhunterz & Vertile feat. Sian Evans","NL","Hardstyle",2023],["Dragonborn","Headhunterz","NL","Hardstyle",2012],["The Sacrifice","Headhunterz","NL","Hardstyle",2011],["Destiny","Headhunterz","NL","Hardstyle",2018],["Colors","Headhunterz feat. Tatu","NL","Hardstyle",2013],["Imaginary","Brennan Heart","NL","Hardstyle",2013],["Lose My Mind","Brennan Heart","NL","Hardstyle",2011],["Till U Believe It","Brennan Heart","NL","Hardstyle",2018],["F.I.F.O.","Brennan Heart","NL","Hardstyle",2014],["Darkest Hour (The Clock)","D-Block & S-te-Fan & Sub Zero Project","NL","Hardstyle",2019],["The Contagion","Sub Zero Project","NL","Rawstyle",2019],["Trip To Mars","Coone","BE","Hardstyle",2019],["Faye","Coone","BE","Hardstyle",2020],["Scrap Attack","Headhunterz","NL","Hardstyle",2009],["Primal Energy","D-Block & S-te-Fan","NL","Hardstyle",2020],["Ride With Uz","D-Block & S-te-Fan","NL","Hardstyle",2017],["World Of Dreams","Da Tweekaz","NO","Hardstyle",2016],["Jägermeister","Da Tweekaz","NO","Hardstyle",2012],["Tweeka","Da Tweekaz","NO","Hardstyle",2014],["The Project","Ran-D","NL","Rawstyle",2017],["Living For The Moment","Ran-D","NL","Hardstyle",2011],["Zombie","Ran-D","NL","Hardstyle",2018],["Sloop John B","Sound Rush","NL","Hardstyle",2020],["Brothers","Sound Rush","NL","Hardstyle",2019],["Take It All","Sound Rush","NL","Hardstyle",2021],["Kicking Ass","Warface","NL","Rawstyle",2019],["Overdrive","Warface","NL","Rawstyle",2017],["Live For This","Warface","NL","Rawstyle",2018],["The End","Act of Rage","NL","Rawstyle",2020],["Conquer","Act of Rage","NL","Rawstyle",2019],["Let The Games Begin","Act of Rage","NL","Rawstyle",2021],["Darkest Moment","Rejecta","NL","Rawstyle",2018],["Followed","Rejecta","NL","Rawstyle",2019],["Still Here","Rejecta","NL","Rawstyle",2020],["Starlight","Phuture Noize","NL","Rawstyle",2018],["The Temple","Phuture Noize","NL","Rawstyle",2019],["Fire","Phuture Noize","NL","Rawstyle",2021],["Infinity","B-Front & Hard Driver","NL","Hardstyle",2021],["Magic","B-Front & Frontliner","NL","Hardstyle",2010],["Beyond Reality","B-Front","NL","Rawstyle",2020],["Imaginary","Sefa","NL","Frenchcore",2018],["Nobody Knows","Sefa","NL","Frenchcore",2019],["Killing In The Name","Sefa","NL","Frenchcore",2020],["My Life","Zatox","IT","Hardstyle",2012],["Wildest","Zatox","IT","Hardstyle",2016],["Drop It","Rooler","IT","Rawstyle",2020],["YES!","Rooler","IT","Rawstyle",2021],["Domination","Rooler","IT","Rawstyle",2019],["Go Stupid","Sickmode","IT","Rawstyle",2021],["Rumble In The Jungle","Sickmode","IT","Rawstyle",2020],["Club Banger","Sickmode","IT","Rawstyle",2022],["The Death Of Us","Rebelion","SC","Rawstyle",2020],["City Lights","Rebelion","SC","Rawstyle",2019],["Bass Ex Machina","Rebelion","SC","Rawstyle",2021],["Activation","Aversion","NL","Rawstyle",2022],["Outlaw","Aversion","NL","Rawstyle",2021],["Sinners","Aversion","NL","Rawstyle",2023],["Freak","Mutilator","NL","Rawstyle",2022],["Onslaught","Mutilator","NL","Rawstyle",2021],["Psycho","Mutilator","NL","Rawstyle",2023],["The Sound Of The Future","Dr. Peacock","NL","Frenchcore",2017],["Trip To Valhalla","Dr. Peacock","NL","Frenchcore",2018],["Frenchcore Family","Dr. Peacock","NL","Frenchcore",2019],["Get It Crackin","Partyraiser","NL","Uptempo",2019],["Ode To Hardcore","Partyraiser","NL","Uptempo",2020],["Anger","Partyraiser","NL","Uptempo",2021],["Cocaine","N-Vitral","NL","Hardcore",2019],["Crispy","N-Vitral","NL","Hardcore",2020],["The Ultimate","N-Vitral","NL","Hardcore",2021],["Raise Your Fist","Angerfist","NL","Hardcore",2006],["Pennywise","Angerfist","NL","Hardcore",2014],["Incoming","Angerfist","NL","Hardcore",2018],["Never Alone","Miss K8","UA","Hardcore",2017],["Legacy","Miss K8","UA","Hardcore",2019],["Out Of The Frame","Miss K8","UA","Hardcore",2020],["Black","Tha Playah","NL","Hardcore",2008],["Why So Serious","Tha Playah","NL","Hardcore",2016],["Walking The Line","Tha Playah","NL","Hardcore",2019],["The Resonance","Ophidian","NL","Hardcore",2019],["Nothing Is Real","Ophidian","NL","Hardcore",2016],["Butterfly VIP","Ophidian","NL","Hardcore",2017]];target=songs[DAILY_INDEX];
function renderResults(){const q=norm(guessInput.value);if(!q){results.innerHTML='';return}const words=q.split(/\\s+/);const found=songs.filter(s=>words.every(w=>norm(s[0]).includes(w))).slice(0,12);results.innerHTML=found.map(s=>'<div class="result" data-id="'+songs.indexOf(s)+'"><b>'+esc(s[0])+'</b><span class="resultArtist">'+esc(s[1])+'</span></div>').join('');results.querySelectorAll('.result').forEach(el=>el.onclick=()=>{guessInput.value=songs[Number(el.dataset.id)][0]+' — '+songs[Number(el.dataset.id)][1];results.innerHTML='';guessInput.dataset.song=el.dataset.id})}guessInput.addEventListener('input',()=>{delete guessInput.dataset.song;renderResults()});guessInput.addEventListener('keydown',e=>{if(e.key==='Enter')submitGuess()});guessSubmit.onclick=submitGuess;
function submitGuess(){if(gameOver)return;const id=Number(guessInput.dataset.song);if(!Number.isInteger(id)||!songs[id])return;const s=songs[id];guesses++;const row=document.createElement('div');row.className='guessRow'+(id===DAILY_INDEX?' correct':'');row.innerHTML='<div class="guessCell '+cellClass(s[0],target[0],0)+' title">'+esc(s[0])+'</div><div class="guessCell '+cellClass(s[1],target[1],1)+'">'+esc(s[1])+'</div><div class="guessCell '+cellClass(s[2],target[2],2)+'">'+flag(s[2])+'</div><div class="guessCell '+cellClass(s[3],target[3],3)+'">'+esc(s[3])+'</div><div class="guessCell '+cellClass(s[4],target[4],4)+'">'+s[4]+'</div>';guessList.prepend(row);guessInput.value='';delete guessInput.dataset.song;results.innerHTML='';if(id===DAILY_INDEX)finishGame(true);else if(guesses>=MAX_GUESSES)finishGame(false)}
</script></body></html>
