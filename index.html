<!doctype html><html lang="sv"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>HARDLE</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#2b1040,#0b0b0e 48%);color:#fff;font-family:Arial,sans-serif}.page{width:min(1080px,100%);margin:auto;padding:28px 18px 50px}header{text-align:center;margin-bottom:26px}.logo{font-size:clamp(52px,9vw,86px);font-weight:1000;letter-spacing:-6px}.logo span{color:#c026ff}.tag{color:#a1a1aa;text-transform:uppercase;letter-spacing:2px;font-weight:700;margin-top:8px}.card{background:#15151bcc;border:1px solid #302737;border-radius:24px;padding:22px;box-shadow:0 24px 70px #0008}.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:22px}.art{min-height:340px;border-radius:18px;background:linear-gradient(135deg,#35075d,#c026ff 50%,#08080a);display:grid;place-items:center}.disc{width:155px;height:155px;border-radius:50%;border:9px solid #18181b;background:repeating-radial-gradient(circle,#303035 0 4px,#111114 5px 9px);box-shadow:0 0 70px #c026ffaa}.panel{display:flex;flex-direction:column;justify-content:center}.eyebrow{color:#c026ff;font-weight:900;letter-spacing:2px;font-size:13px;text-transform:uppercase}h1{font-size:clamp(34px,5vw,56px);line-height:.95;margin:10px 0 16px}.desc{color:#a1a1aa;line-height:1.6;margin:0 0 22px}.play{border:0;border-radius:14px;padding:16px 20px;background:#c026ff;color:white;font-weight:900;font-size:16px;cursor:pointer}.guesses{display:grid;gap:10px;margin-top:18px}.guess{height:54px;border:1px solid #302737;border-radius:13px;background:#101014;padding:0 16px;display:flex;align-items:center;color:#71717a;font-weight:800}.guess.active{border-color:#c026ff;color:#fff}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.stat{background:#101014;border:1px solid #25252b;border-radius:15px;text-align:center;padding:17px}.stat b{display:block;font-size:25px}.stat span{color:#71717a;font-size:11px;text-transform:uppercase;letter-spacing:1px}footer{text-align:center;color:#52525b;margin-top:22px;font-size:12px}@media(max-width:720px){.hero{grid-template-columns:1fr}.art{min-height:240px}.stats{grid-template-columns:1fr 1fr 1fr}.page{padding:18px 12px 40px}}</style></head><body><main class="page"><header><div class="logo">HARD<span>LE</span></div><div class="tag">Guess the hardstyle track of the day</div></header><section class="card hero"><div class="art"><div class="disc"></div></div><div class="panel"><div class="eyebrow">Daily #001</div><h1>Can you recognize the track?</h1><p class="desc">Listen to a short preview, make your guess, and identify today's hardstyle banger.</p><button class="play" id="start">▶ Start today's Hardle</button><div class="guesses"><div class="guess active">1&nbsp;&nbsp; Your first guess</div><div class="guess">2&nbsp;&nbsp; Locked</div><div class="guess">3&nbsp;&nbsp; Locked</div><div class="guess">4&nbsp;&nbsp; Locked</div></div></div></section><section class="stats"><div class="stat"><b>0</b><span>Played</span></div><div class="stat"><b>0</b><span>Streak</span></div><div class="stat"><b>—</b><span>Best</span></div></section><footer>HARDLE • A daily hardstyle guessing game</footer></main><script>document.getElementById('start').onclick=()=>alert('Game system coming next.');</script></body></html>
