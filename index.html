<!doctype html><html lang="sv"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>HARDLE</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(rgba(5,5,8,.72),rgba(5,5,8,.88)),url('https://commons.wikimedia.org/wiki/Special:FilePath/RED_DEFQON1_2025.jpg') center/cover fixed;color:#fff;font-family:Arial,sans-serif}.page{width:min(1080px,100%);margin:auto;padding:28px 18px 50px}header{text-align:center;margin-bottom:26px}.logo{font-size:clamp(52px,9vw,86px);font-weight:1000;letter-spacing:-6px;text-shadow:0 5px 25px #000}.logo span{color:#c026ff}.tag{color:#d4d4d8;text-transform:uppercase;letter-spacing:2px;font-weight:700;margin-top:8px;text-shadow:0 2px 10px #000}.card{position:relative;background:#111117dd;border:1px solid #ffffff25;border-radius:24px;padding:22px;box-shadow:0 24px 70px #000a;backdrop-filter:blur(3px)}.hero{display:grid;grid-template-columns:.82fr 1.18fr;gap:22px;align-items:center}.art{min-height:270px;border-radius:18px;background:linear-gradient(135deg,#35075dcc,#c026ff88 50%,#08080add);display:grid;place-items:center;overflow:hidden}.disc{width:125px;height:125px;border-radius:50%;border:9px solid #18181b;background:repeating-radial-gradient(circle,#303035 0 4px,#111114 5px 9px);box-shadow:0 0 60px #c026ffaa}.panel{display:flex;flex-direction:column;justify-content:center}.eyebrow{color:#d34cff;font-weight:900;letter-spacing:2px;font-size:13px;text-transform:uppercase}h1{font-size:clamp(34px,5vw,56px);line-height:.95;margin:10px 0 16px}.desc{color:#c4c4ca;line-height:1.6;margin:0 0 22px}.play{border:0;border-radius:14px;padding:16px 20px;background:#c026ff;color:white;font-weight:900;font-size:16px;cursor:pointer}.guesses{display:grid;gap:10px;margin-top:18px}.guess{height:54px;border:1px solid #ffffff1c;border-radius:13px;background:#101014cc;padding:0 16px;display:flex;align-items:center;color:#71717a;font-weight:800}.guess.active{border-color:#c026ff;color:#fff}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.stat{background:#101014cc;border:1px solid #ffffff18;border-radius:15px;text-align:center;padding:17px}.stat b{display:block;font-size:25px}.stat span{color:#a1a1aa;font-size:11px;text-transform:uppercase;letter-spacing:1px}footer{text-align:center;color:#a1a1aa;margin-top:22px;font-size:12px}.volume{position:absolute;top:18px;right:18px;z-index:5;display:flex;align-items:center;gap:9px;padding:7px 9px;background:#08080dcc;border:1px solid #ffffff20;border-radius:11px;box-shadow:0 6px 20px #0007;backdrop-filter:blur(6px)}.volume button{width:32px;height:32px;border:0;border-radius:8px;background:#c026ff;color:#fff;font-size:16px;cursor:pointer;display:grid;place-items:center}.volume input{width:85px;accent-color:#c026ff;cursor:pointer}.volume button:hover{filter:brightness(1.15)}@media(max-width:720px){.hero{grid-template-columns:1fr}.art{min-height:210px}.stats{grid-template-columns:1fr 1fr 1fr}.page{padding:18px 12px 40px}.volume{top:12px;right:12px}.volume input{width:65px}}</style></head><body><main class="page"><header><div class="logo">HARD<span>LE</span></div><div class="tag">Guess the hardstyle track of the day</div></header><section class="card hero"><div class="volume"><button id="volumeBtn" aria-label="Volym">🔊</button><input id="volumeSlider" type="range" min="0" max="100" value="80" aria-label="Volym"></div><div class="art"><div class="disc"></div></div><div class="panel"><div class="eyebrow">Daily #001</div><h1>Can you recognize the track?</h1><p class="desc">Listen to a short preview, make your guess, and identify today's hardstyle banger.</p><button class="play" id="start">▶ Start today's Hardle</button><div class="guesses"><div class="guess active">1&nbsp;&nbsp; Your first guess</div><div class="guess">2&nbsp;&nbsp; Locked</div><div class="guess">3&nbsp;&nbsp; Locked</div><div class="guess">4&nbsp;&nbsp; Locked</div></div></div></section><section class="stats"><div class="stat"><b>0</b><span>Played</span></div><div class="stat"><b>0</b><span>Streak</span></div><div class="stat"><b>—</b><span>Best</span></div></section><footer>HARDLE • A daily hardstyle guessing game</footer></main><script>const volumeBtn=document.getElementById('volumeBtn'),volumeSlider=document.getElementById('volumeSlider');volumeBtn.onclick=()=>{volumeSlider.value=volumeSlider.value==='0'?'80':'0';volumeBtn.textContent=volumeSlider.value==='0'?'🔇':'🔊'};volumeSlider.oninput=()=>{volumeBtn.textContent=volumeSlider.value==='0'?'🔇':'🔊'};document.getElementById('start').onclick=()=>alert('Game system coming next.');</script></body></html>
