}.flag-it{background:linear-gradient(to right,#009246 0 33.33%,#fff 33.33% 66.66%,#ce2b37 66.66%)}.guessCell.match{background:#163b27;border-color:#38d27a;color:#d9ffe8}.guessCell.partial{background:#3b3516;border-color:#d6b83d;color:#fff3b0}.guessCell.noMatch{background:#17171b;border-color:#ffffff16;color:#aaa}.guessRow.correct .guessCell{border-color:#38d27a}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.stat{background:#101014cc;border:1px solid #ffffff18;border-radius:15px;text-align:center;padding:17px}.stat b{display:block;font-size:25px}.stat span{color:#a1a1aa;font-size:11px;text-transform:uppercase;letter-spacing:1px}footer{text-align:center;color:#a1a1aa;margin-top:22px;font-size:12px}.volume{position:absolute;top:11px;right:11px;z-index:5;display:flex;align-items:center;gap:4px;padding:3px 5px;background:#08080dcc;border:1px solid #ffffff15;border-radius:7px;box-shadow:0 4px 12px #0006;backdrop-filter:blur(4px)}.volume button{width:23px;height:23px;border:0;border-radius:5px;background:#e21b23;color:#fff;font-size:11px;cursor:pointer;display:grid;place-items:center}.volume input{width:48px;height:12px;accent-color:#e21b23;cursor:pointer}.volume button:hover{filter:brightness(1.15)}#sc-player{position:fixed;width:1px;height:1px;left:-10px;bottom:-10px;border:0;opacity:0;pointer-events:none}@media(max-width:720px){.hero{grid-template-columns:1fr}.art{min-height:210px}.stats{grid-template-columns:1fr 1fr 1fr}.page{padding:18px 12px 40px}.volume{top:9px;right:9px}.volume input{width:40px}.guessHeader,.guessRow{grid-template-columns:1.35fr 1.1fr .75fr .9fr .6fr}.guessCell{font-size:10px;min-height:42px;padding:6px 3px}}</style></head><body><main class="page"><header><div class="logo">HARD<span>LE</span></div><div class="tag">Guess the hardstyle track of the day</div></header><section class="card hero"><div class="volume"><button id="volumeBtn" aria-label="Volym">🔊</button><input id="volumeSlider" type="range" min="0" max="100" value="35" aria-label="Volym"></div><div class="art"><div class="disc"></div></div><div class="panel"><div class="eyebrow">Daily #001</div><h1>Can you recognize the track?</h1><p class="desc">Listen to a short preview, search for a track, and submit your guess.</p><button class="play" id="start">▶ Play 5s preview</button><div class="guessBox"><input id="guessInput" class="guessInput" autocomplete="off" placeholder="Sök efter artist eller låt..." aria-label="Sök efter låt"><button id="guessSubmit" class="guessSubmit">Gissa</button><div id="results" class="results"></div></div><div class="guessHeader"><div>Låt</div><div>Artist</div><div>Land</div><div>Genre</div><div>År</div></div><div id="guessList" class="guessList"></div></div></section><section class="stats"><div class="stat"><b>0</b><span>Played</span></div><div class="stat"><b>0</b><span>Streak</span></div><div class="stat"><b>—</b><span>Best</span></div></section><footer>HARDLE • A daily hardstyle guessing game</footer></main><iframe id="sc-player" scrolling="no" allow="autoplay" src="https://w.soundcloud.com/player/?url=https%3A%2F%2Fsoundcloud.com%2Fq-dancemusic&auto_play=false&hide_related=true&show_comments=false&show_user=false&show_reposts=false&show_teaser=false&visual=false&color=%23e21b23"></iframe><script src="https://w.soundcloud.com/player/api.js"></script><script>const volumeBtn=document.getElementById('volumeBtn'),volumeSlider=document.getElementById('volumeSlider'),start=document.getElementById('start'),guessInput=document.getElementById('guessInput'),guessSubmit=document.getElementById('guessSubmit'),results=document.getElementById('results'),guessList=document.getElementById('guessList'),widget=SC.Widget(document.getElementById('sc-player'));let scReady=false,trackIndex=null,round=0,playing=false,stopTimer=null,soundPool=[],selectedGuess=null,targetLoaded=false;const previewTimes=[5,10,15],defaultVolume=35;widget.bind(SC.Widget.Events.READY,()=>{scReady=true;widget.setVolume(defaultVolume);loadSounds();});volumeBtn.onclick=()=>{volumeSlider.value=volumeSlider.value==='0'?defaultVolume:'0';volumeBtn.textContent=volumeSlider.value==='0'?'🔇':'🔊';if(scReady)widget.setVolume(Number(volumeSlider.value));};volumeSlider.oninput=()=>{volumeBtn.textContent=volumeSlider.value==='0'?'🔇':'🔊';if(scReady)widget.setVolume(Number(volumeSlider.value));};function dailyIndex(count){const d=new Date(),key=d.getUTCFullYear()*10000+(d.getUTCMonth()+1)*100+d.getUTCDate();return Math.abs((key*9301+49297)%233280)%Math.min(400,count);}const artistSources=['https://soundcloud.com/headhunterz','https://soundcloud.com/subzeroproject','https://soundcloud.com/dbstf','https://soundcloud.com/wildstylez','https://soundcloud.com/randmusic','https://soundcloud.com/dj-brennan-heart','https://soundcloud.com/phuture-noize','https://soundcloud.com/warface','https://soundcloud.com/dsturb','https://soundcloud.com/rebelion','https://soundcloud.com/vertile','https://soundcloud.com/soundrush','https://soundcloud.com/atmozfears','https://soundcloud.com/noisecontrollers','https://soundcloud.com/frontliner','https://soundcloud.com/coone','https://soundcloud.com/zatox','https://soundcloud.com/radicalredemption','https://soundcloud.com/b-front','https://soundcloud.com/rejecta','https://soundcloud.com/actofrage','https://soundcloud.com/adaro','https://soundcloud.com/e-force','https://soundcloud.com/keltek','https://soundcloud.com/devinwild','https://soundcloud.com/thepurge','https://soundcloud.com/mutilator','https://soundcloud.com/adjuzt','https://soundcloud.com/rooler','https://soundcloud.com/sickmode','https://soundcloud.com/dualdamage','https://soundcloud.com/aversion','https://soundcloud.com/sefa','https://soundcloud.com/dr-peacock','https://soundcloud.com/billx','https://soundcloud.com/dj-d-fence','https://soundcloud.com/le-bask','https://soundcloud.com/maissouille','https://soundcloud.com/andythecore','https://soundcloud.com/partyraiser','https://soundcloud.com/n-vitral','https://soundcloud.com/o eturn (/hardstyle|rawstyle|hard dance|hardcore|frenchcore|uptempo/.test(g)||/hardstyle|rawstyle|hardcore|frenchcore|uptempo/.test(t))&&!/\b(live|liveset|set|podcast|yearmix|bootleg|mashup|megamix|dj mix|mix series|edit)\b/i.test(t)&&!!s.permalink_url;}function loadSounds(){soundPool=[];sourcePos=0;loadingSources=true;loadNextSource();}function loadWidget(url,callback){widget.load(url,{auto_play:false,callback:callback});}function loadNextSource(){if(sourcePos>=artistSources.length){loadingSources=false;if(soundPool.length){const unique=[];const seen=new Set();for(const s of soundPool){if(!seen.has(s.id)){seen.add(s.id);unique.push(s);}}soundPool=unique;trackIndex=dailyIndex(soundPool.length);guessInput.disabled=false;guessSubmit.disabled=false;const target=soundPool[trackIndex];if(target)loadWidget(target.permalink_url,()=>{targetLoaded=true;widget.setVolume(Number(volumeSlider.value));});}return;}const url=artistSources[sourcePos++];loadWidget(url,()=>{widget.getSounds(sounds=>{soundPool.push(...(sounds||[]).filter(cleanOfficial));loadNextSource();});});}function stopPreview(){if(stopTimer){clearTimeout(stopTimer);stopTimer=null}if(scReady)widget.pause();playing=false;start.classList.remove('playing');if(round<previewTimes.length)start.textContent='▶ Play '+previewTimes[round]+'s preview';else{start.textContent='✓ All previews unlocked';start.disabled=true;}}function playPreview(){if(!scReady||trackIndex===null||playing||!targetLoaded)return;const seconds=previewTimes[round];playing=true;start.textContent='⏸ Playing '+seconds+'s preview';start.classList.add('playing');widget.setVolume(Number(volumeSlider.value));widget.seekTo(0);widget.play();stopTimer=setTimeout(()=>{stopPreview();if(round<previewTimes.length-1)round++;},seconds*1000);}start.onclick=()=>{if(!scReady||trackIndex===null)return;if(playing)stopPreview();else playPreview();};function normalize(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9åäö]+/g,' ').trim();}function renderResults(){const q=normalize(guessInput.value);if(!q||!soundPool.length){results.innerHTML='';return;}const words=q.split(/\s+/);const matches=soundPool.filter(s=>words.every(w=>normalize((s.user&&s.user.username||'')+' '+(s.title||'')).includes(w) )).slice(0,8);results.innerHTML=matches.map((s,i)=>'<div class="result"><div><b>'+escapeHtml(s.title||'Unknown')+'</b><span class="resultArtist">'+escapeHtml((s.user&&s.user.username)||'—')+'</span></div></div>').join('');results.querySelectorAll('.result').forEach((el,i)=>el.onclick=()=>{selectedGuess=matches[i];guessInput.value=selectedGuess.title||'';results.innerHTML='';});}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function meta(s){const artist=s.user&&s.user.username?s.user.username:'—',genre=String(s.genre||'Hardstyle').replace(/^\s*dance\s*:\s*/i,'').trim()||'Hardstyle';return {title:s.title||'—',artist,country:countryFor(s),genre,year:s.release_year||s.release_date?.slice(0,4)||'—'};}guessInput.addEventListener('input',()=>{selectedGuess=null;renderResults();});guessInput.addEventListener('keydown',e=>{if(e.key==='Enter')submitGuess();});guessSubmit.onclick=submitGuess;function submitGuess(){if(!selectedGuess){const q=normalize(guessInput.value);if(!q)return;selectedGuess=soundPool.find(s=>normalize((s.user&&s.user.username||'')+' '+(s.title||'')).includes(q));if(!selectedGuess)return;}const target=soundPool[trackIndex],correct=selectedGuess.id===target.id,m=meta(selectedGuess),tm=meta(target),row=document.createElement('div');row.className='guessRow '+(correct?'correct':'wrong');const same=(a,b)=>normalize(String(a||''))===normalize(String(b||''));const cell=(value,state,extra='')=>'<div class="guessCell '+state+' '+extra+'">'+escapeHtml(value)+'</div>';const flag=v=>({'Netherlands':'<span class="flag flag-nl" title="Netherlands"></span>','Belgium':'<span class="flag flag-be" title="Belgium"></span>','Italy':'<span class="flag flag-it" title="Italy"></span>'}[v]||'—');const rawCell=(value,state)=>'<div class="guessCell '+state+'">'+value+'</div>';row.innerHTML=cell(m.title,same(m.title,tm.title)?'match':'noMatch','title')+cell(m.artist,same(m.artist,tm.artist)?'match':'noMatch')+rawCell(flag(m.country),same(m.country,tm.country)&&m.country!=='—'?'match':'noMatch')+cell(m.genre,same(m.genre,tm.genre)?'match':'noMatch')+cell(m.year,same(m.year,tm.year)?'match':'noMatch');guessList.prepend(row);if(correct){guessInput.disabled=true;guessSubmit.disabled=true;results.innerHTML='';start.disabled=true;start.textContent='✓ Correct!';}else{guessInput.value='';selectedGuess=null;results.innerHTML='';}}widget.bind(SC.Widget.Events.FINISH,stopPreview);</script></body></html>
