function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function norm(s){return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9åäö]+/g,' ').trim()}
function flag(v){return v==='NL'?'<span class="flag flag-nl"></span>':v==='BE'?'<span class="flag flag-be"></span>':v==='IT'?'<span class="flag flag-it"></span>':'—'}
function renderResults(){
 const q=norm(guessInput.value); if(!q){results.innerHTML='';return}
 const words=q.split(/\s+/);
 const found=songs.filter(s=>words.every(w=>norm(s[0]+' '+s[1]).includes(w))).slice(0,12);

}

 const id=Number(guessInput.dataset.song); if(!Number.isInteger(id)||!songs[id])return;

 guessList.prepend(row);guessInput.value='';delete guessInput.dataset.song;results.innerHTML='';
